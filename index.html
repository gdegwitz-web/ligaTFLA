  openModal(`
    <h3>Eliminar a ${escapeHtml(u.nombre)}</h3>
    <div class="aviso-rechazo">
      Se van a borrar de forma permanente:
      <ul style="margin:8px 0 0 18px; line-height:1.6;">
        <li>Su cuenta y su rol en la liga</li>
        ${u.jugadorId ? '<li>Su ficha de jugador y su lugar en la nómina</li>' : ''}
        <li>Su selfie y su foto de cédula</li>
      </ul>
    </div>
    <div class="auth-note">
      Las incidencias que ya estén en actas cargadas <b>no</b> se borran: el registro
      histórico de los partidos se mantiene intacto.
      <br><br>
      Su correo <b>${escapeHtml(u.email||'')}</b> seguirá ocupado en Firebase, así que no

      la consola de Firebase, en Authentication → Users.
      <br><br>

    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-secondary" style="flex:1;" onclick="revisarFichaJugador('${uid}')">Cancelar</button>
      <button class="btn btn-danger" style="flex:1;" onclick="eliminarUsuarioCompleto('${uid}')">Sí, eliminar</button>
    </div>
  `);
}

async function eliminarUsuarioCompleto(uid){
  if(uid === currentUser.uid){ toast('No puedes eliminar tu propia cuenta', 'error'); return; }
  try{
    const uDoc = await db.collection('users').doc(uid).get();
    const u = uDoc.exists ? uDoc.data() : {};

    // 1) Documentos de identidad
    await db.collection('documentos').doc(uid).delete().catch(()=>{});

    // 2) Ficha de jugador (por id guardado y, por si acaso, por uid)
    const fichas = new Set();
    if(u.jugadorId) fichas.add(u.jugadorId);
    const porUid = await db.collection('jugadores').where('uid','==',uid).get().catch(()=>({docs:[]}));
    porUid.docs.forEach(d => fichas.add(d.id));
    for(const fid of fichas){
      await db.collection('jugadores').doc(fid).delete().catch(()=>{});
    }
    // 3) La cuenta
    await db.collection('users').doc(uid).delete();

    closeModal();
    toast('Cuenta y datos eliminados', 'success');
    renderUsuarios();
  }catch(e){
    toast('Error: ' + e.message, 'error');
  }
}

async function aprobarJugador(uid, jugadorId){
  try{
    await db.collection('users').doc(uid).update({ estado: EST.APROBADO });
    if(jugadorId){
      await db.collection('jugadores').doc(jugadorId).update({ estado: EST.APROBADO });
    }
    closeModal();
    toast('Jugador aprobado', 'success');
    renderUsuarios();
  }catch(e){
    toast('Error: ' + e.message, 'error');
  }
}

async function rechazarSolicitud(uid){
  const motivo = prompt('¿Qué tiene que corregir? Este mensaje lo va a ver la persona:');
  if(motivo === null) return;
  try{
    await db.collection('users').doc(uid).update({
      estado: EST.RECHAZADO,

    });
    closeModal();
    toast('Solicitud devuelta');

    toast('Error: ' + e.message, 'error');

}

async function eliminarDocumentos(uid){
  if(!confirm('¿Eliminar la selfie y la foto de cédula? La ficha deportiva del jugador se mantiene.')) return;
  try{
    await db.collection('documentos').doc(uid).delete();
    closeModal();
    toast('Documentos eliminados', 'success');
  }catch(e){
    toast('Error: ' + e.message, 'error');
  }
}

async function aprobarUsuario(uid){
  try{
    await db.collection('users').doc(uid).update({estado:'aprobado'});

/* =========================================================================
   RESUMEN DE UNA PLANTILLA
   Un delegado necesita ver de un golpe si le faltan porteros o si tiene
   demasiada gente en una categoría. Contar a mano una lista de quince
   nombres no sirve.
   ========================================================================= */
function resumenPlantillaHtml(jugadores){
  const total = jugadores.length;
  if(total === 0) return '';

  const porPosicion = {};
  POSICIONES.forEach(p => porPosicion[p] = 0);
  let sinPosicion = 0;
  jugadores.forEach(j => {
    if(j.posicion && porPosicion[j.posicion] !== undefined) porPosicion[j.posicion]++;
    else sinPosicion++;
  });

  const porCategoria = {};
  CATEGORIAS_EDAD.forEach(c => porCategoria[c.id] = 0);
  let sinFecha = 0, sumaEdad = 0, conEdad = 0;
  jugadores.forEach(j => {
    const r = categoriaDeFicha(j);
    if(r && r.categoria){ porCategoria[r.categoria.id]++; sumaEdad += r.edad; conEdad++; }
    else sinFecha++;
  });

  const porRelacion = {};
  jugadores.forEach(j => {
    const t = tipoRelacionPorId(j.tipoRelacion);
    const k = t ? t.label : 'Sin especificar';
    porRelacion[k] = (porRelacion[k] || 0) + 1;
  });

  const edadProm = conEdad ? Math.round(sumaEdad / conEdad) : null;
  const barra = (n) => `${Math.round(n/total*100)}%`;

  // Solo quienes pueden corregirlo (administración y delegados) ven el aviso.
  const repetidas = [ROLES.LIGA_ADMIN, ROLES.DELEGADO].includes(currentProfile.rol) ? camisetasRepetidas(jugadores) : [];
  const avisoRepetidas = repetidas.length ? `
  <div class="card" style="border-left:4px solid var(--card-red); padding:15px 18px;">
    <div style="font-weight:600; font-size:14.5px;">Hay camisetas repetidas</div>
    <p style="font-size:13px; color:var(--ink-soft); line-height:1.6; margin:6px 0 0;">
      ${repetidas.map(r => `<b>#${r.numero}</b>: ${r.nombres.map(escapeHtml).join(' y ')}`).join('<br>')}
    </p>
    <p style="font-size:12.5px; color:var(--ink-faint); margin:8px 0 0;">
      Un número solo puede tenerlo un jugador. Corrígelo desde <b>Editar</b>, o déjalo en blanco.
    </p>
  </div>` : '';

  return `${avisoRepetidas}
  <div class="card resumen-plantilla">
    <div class="resumen-cifras">
      <div class="cifra">
        <div class="cifra-num">${total}</div>
        <div class="cifra-lbl">jugador${total===1?'':'es'}</div>

function ordenarPlantilla(a, b){
  const na = (a.numero === null || a.numero === undefined) ? 9999 : a.numero;
  const nb = (b.numero === null || b.numero === undefined) ? 9999 : b.numero;
  if(na !== nb) return na - nb;
  return (a.nombre || '').localeCompare(b.nombre || '');
}

async function guardarJugadorManual(equipoId, jugadorId){
  const nombre = formatearNombre(document.getElementById('jmNombre').value);
  if(!nombre){ toast('El nombre es obligatorio', 'error'); return; }
  const cedula = armarCedula(document.getElementById('jmCedulaLetra').value,
                             document.getElementById('jmCedula').value);
  const telefono = formatearTelefono(document.getElementById('jmTelefono').value);
  if(!cedula){ toast('La cédula es obligatoria', 'error'); return; }
  if(!cedulaValida(cedula)){ toast('La cédula debe tener entre 6 y 9 dígitos', 'error'); return; }
  if(!telefono){ toast('El teléfono es obligatorio', 'error'); return; }
  if(!telefonoValido(telefono)){ toast('El teléfono debe tener 11 dígitos (0414-1234567)', 'error'); return; }
  const rel = leerRelacion('jm', false);
  if(!rel.ok){ toast(rel.error, 'error'); return; }

  let cam;
  try{
    cam = await validarCamiseta(equipoId, document.getElementById('jmNumero').value,
      { ids: [jugadorId].filter(Boolean) });
  }catch(e){
    cam = { ok: false, error: 'No se pudo verificar la camiseta. Revisa tu conexión, o déjala en blanco.' };
  }
  if(!cam.ok){
    toast(cam.ocupada
      ? `El número ${cam.numero} ya lo tiene ${cam.duenio || 'otro jugador'}. Elige otro o déjalo en blanco.`
      : cam.error, 'error');
    return;
  }
  const data = {
    equipoId,
    nombre,
    numero: cam.numero,
    posicion: document.getElementById('jmPosicion').value,
    cedula,
    telefono,
    fechaNacimiento: document.getElementById('jmFecha').value,
    tipoRelacion: rel.tipoRelacion,
    relacionDetalle: rel.relacionDetalle,
    estado: 'aprobado',
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try{
    let idFinal = jugadorId;
    if(jugadorId){
      await db.collection('jugadores').doc(jugadorId).update(data);
      toast('Jugador actualizado', 'success');
    }else{
      data.uid = null; // cargado a mano; se vincula si el jugador crea su cuenta
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      const ref = await db.collection('jugadores').add(data);
      idFinal = ref.id;
      toast('Jugador agregado', 'success');
    }
    if(_fotoJugadorModal && idFinal){
      await db.collection('fotos').doc(idFinal).set({
        jugadorId: idFinal, uid: null, miniatura: _fotoJugadorModal,
        actualizadaEl: new Date().toISOString()
      }).catch(e => console.warn('foto:', e));
      invalidarFoto(idFinal);
    }
    closeModal();
    refrescarVistaPlantilla(equipoId);
  }catch(e){
    toast('Error: ' + e.message, 'error');
  }
}

/* =========================================================================
   FORMATO ESTÁNDAR DE CAMPOS
   La gente escribe de todas las formas posibles: TODO EN MAYÚSCULAS, cédulas
   con puntos, teléfonos con guiones inventados. Acá se normaliza al guardar,
   así la base queda pareja y las nóminas se leen bien.
   ========================================================================= */

// Partículas que quedan en minúscula dentro de un nombre compuesto.
const PARTICULAS_NOMBRE = new Set(['de','del','la','las','los','y','da','das','do','dos','van','von','di','du','el']);

function formatearNombre(texto){
  if(!texto) return '';
  return texto
    .trim()
    .replace(/\s+/g, ' ')
    .toLocaleLowerCase('es')
    .split(' ')
    .map((palabra, i) => {
      if(i > 0 && PARTICULAS_NOMBRE.has(palabra)) return palabra;
      // Respeta apellidos con apóstrofo o guion: O'Brien, Pérez-Gómez
      return palabra.replace(/(^|[’'\-])([a-záéíóúüñ])/g,
        (m, sep, letra) => sep + letra.toLocaleUpperCase('es'));
    })
    .join(' ');
}

// Cédula venezolana: letra (V o E) + guion + dígitos, sin puntos.
function armarCedula(letra, numero){
  const digitos = String(numero || '').replace(/\D/g, '');
  if(!digitos) return '';
  return `${letra}-${digitos}`;
}

function partirCedula(valor){
  const m = String(valor || '').trim().toUpperCase().match(/^([VE])?\D*(\d[\d.]*)$/);
  if(!m) return { letra:'V', numero:'' };
  return { letra: m[1] || 'V', numero: m[2].replace(/\D/g,'') };
}

function cedulaValida(valor){
  const { numero } = partirCedula(valor);
  return numero.length >= 6 && numero.length <= 9;
}

// Teléfono venezolano: 11 dígitos -> 0414-1234567
function formatearTelefono(texto){
  const d = String(texto || '').replace(/\D/g, '').slice(0, 11);
  if(d.length <= 4) return d;
  return d.slice(0,4) + '-' + d.slice(4);
}

function telefonoValido(texto){
  const d = String(texto || '').replace(/\D/g, '');
  return d.length === 11 && d.startsWith('0');
}

// Enganches para usar directo en los inputs.
function alEscribirTelefono(input){
  const posFinal = input.selectionStart === input.value.length;
  input.value = formatearTelefono(input.value);
  if(posFinal) input.setSelectionRange(input.value.length, input.value.length);
}

function alSalirNombre(input){
  input.value = formatearNombre(input.value);
}

function soloDigitos(input, max){
  input.value = input.value.replace(/\D/g, '').slice(0, max || 9);
}

// Texto del contacto de emergencia, compatible con fichas viejas que lo
// guardaban todo junto en un solo campo.
function textoEmergencia(f){
  if(!f) return '—';
  if(f.contactoEmergenciaNombre || f.contactoEmergenciaTelefono){
    return [f.contactoEmergenciaNombre, f.contactoEmergenciaTelefono].filter(Boolean).join(' · ');
  }
  return f.contactoEmergencia || '—';
}

/* =========================================================================
   CATEGORÍAS POR EDAD
   La edad NO se calcula al día de hoy, sino a una fecha de corte fija: si se
   calculara hoy, un jugador que cumple años a mitad del torneo cambiaría de
   categoría en plena competencia. Para cambiar la fecha de corte, editar la
   constante de abajo.
   ========================================================================= */
// Valores por defecto. Los reales viven en Firestore (config/torneo) y el
// administrador los cambia desde la app, sin tocar el código.
const CONFIG_DEFECTO = {
  fechaCorteEdad: '2026-01-01',      // AAAA-MM-DD
  validacionesRequeridas: 4
};
let CONFIG = { ...CONFIG_DEFECTO };

async function cargarConfig(){
  try{
    const doc = await db.collection('config').doc('torneo').get();
    CONFIG = doc.exists ? { ...CONFIG_DEFECTO, ...doc.data() } : { ...CONFIG_DEFECTO };
  }catch(e){
    console.warn('Config no disponible, se usan los valores por defecto:', e);
    CONFIG = { ...CONFIG_DEFECTO };
  }
  return CONFIG;
}

// El color acompaña, pero nunca es el único indicador: la letra siempre va
// dentro del badge, para que se entienda impreso en blanco y negro o por
// alguien que no distinga esos tonos.
// Ninguno de estos colores se parece al amarillo ni al rojo de las tarjetas.
// Escala progresiva, no cinco colores sueltos: las categorías tienen un orden
// (A es la más joven, E la mayor) y el color lo acompaña avanzando de verde
// azulado a vino, oscureciéndose paso a paso. Así el orden se lee por dos vías
// a la vez: el tono y la profundidad. La E cierra casi en el vino del escudo.
// Ninguno se acerca al amarillo ni al rojo, reservados para las tarjetas.
const CATEGORIAS_EDAD = [
  { id:'menor_35', letra:'A', label:'Menores de 35', corto:'-35',   color:'#2E7B70', color2:'#225B52', min:0,  max:34  },
  { id:'de_35_39', letra:'B', label:'35 a 39 años',  corto:'35-39', color:'#35659B', color2:'#274A72', min:35, max:39  },
  { id:'de_40_47', letra:'C', label:'40 a 47 años',  corto:'40-47', color:'#584A9B', color2:'#413672', min:40, max:47  },
  { id:'de_48_59', letra:'D', label:'48 a 59 años',  corto:'48-59', color:'#7E3A7C', color2:'#5D2A5B', min:48, max:59  },
  { id:'de_60_mas',letra:'E', label:'60 años o más', corto:'60+',   color:'#8A2F42', color2:'#662230', min:60, max:200 }
];

// Relleno del badge: degradado suave del tono base al oscuro.
function fondoCategoria(c){
  return `linear-gradient(150deg, ${c.color} 0%, ${c.color2} 100%)`;
}

// Edad cumplida a la fecha de corte.
function calcularEdad(fechaNacimiento, fechaRef){
  if(!fechaNacimiento) return null;
  const nac = new Date(fechaNacimiento + 'T00:00:00');
  const ref = new Date((fechaRef || CONFIG.fechaCorteEdad) + 'T00:00:00');
  if(isNaN(nac.getTime()) || isNaN(ref.getTime())) return null;
  if(nac > ref) return null;

  let edad = ref.getFullYear() - nac.getFullYear();
  const mes = ref.getMonth() - nac.getMonth();
  // Si todavía no llegó el cumpleaños en el año de referencia, resta uno.
  if(mes < 0 || (mes === 0 && ref.getDate() < nac.getDate())) edad--;
  return edad;
}

function categoriaPorEdad(edad){
  if(edad === null || edad === undefined) return null;
  return CATEGORIAS_EDAD.find(c => edad >= c.min && edad <= c.max) || null;
}

// Devuelve {edad, categoria} o null si la ficha no tiene fecha de nacimiento.
function categoriaDeFicha(ficha){
  const edad = calcularEdad(ficha && ficha.fechaNacimiento);
  if(edad === null) return null;
  return { edad, categoria: categoriaPorEdad(edad) };
}

function etiquetaCategoria(ficha){
  const r = categoriaDeFicha(ficha);
  if(!r || !r.categoria) return '—';
  return `${r.categoria.letra} · ${r.categoria.label} · ${r.edad} años`;
}

function etiquetaCategoriaCorta(ficha){
  const r = categoriaDeFicha(ficha);
  if(!r || !r.categoria) return '—';
  return r.categoria.letra;
}

// Badge de color con la letra. conRango agrega el rango de edad al lado.
function badgeCategoriaHtml(ficha, conRango){
  const r = categoriaDeFicha(ficha);
  if(!r || !r.categoria) return '<span class="badge">Sin categoría</span>';
  const c = r.categoria;
  return `<span class="cat-badge" style="background:${fondoCategoria(c)};" title="${c.label} · ${r.edad} años">${c.letra}</span>${
    conRango ? `<span class="cat-rango">${c.label} · ${r.edad} años</span>` : ''}`;
}

// Leyenda de las cinco categorías, para las nóminas.
function leyendaCategoriasHtml(){
  return `<div class="cat-leyenda">
    ${CATEGORIAS_EDAD.map(c => `<span class="cat-leyenda-item">
      <span class="cat-badge" style="background:${fondoCategoria(c)};">${c.letra}</span>${c.label}
    </span>`).join('')}
  </div>`;
}

/* =========================================================================
   TIPO DE RELACIÓN CON EL COLEGIO
   Define la elegibilidad del jugador en el torneo. Algunas opciones piden un
   dato extra (la promoción, cuál colegio hermano, o una aclaración libre),
   que se guarda en un único campo: relacionDetalle.
   ========================================================================= */
const TIPOS_RELACION = [
  { id:'ex_alumno',    label:'Ex alumno',                                   detalle:'Promoción', placeholder:'Ej: 1998' },
  { id:'papa_arcos',   label:'Papá o Ex Papá · Colegio Los Arcos',          detalle:null },
  { id:'papa_hermano', label:'Papá o Ex Papá · Colegio Hermano',            detalle:'Colegio', opciones:['Canigua','Los Campitos','Otro'] },
  { id:'profesor',     label:'Profesor',                                    detalle:null },
  { id:'invitado',     label:'Invitado',                                    detalle:null },
  { id:'otro',         label:'Otro',                                        detalle:'Especifique', placeholder:'¿Cuál es tu vínculo con el colegio?' }
];

// Muestra la categoría apenas se escribe la fecha, para que el jugador vea
// en qué categoría queda antes de enviar la ficha.
function mostrarCategoriaEnVivo(pfx){
  const input = document.getElementById(pfx + 'Fecha');
  const salida = document.getElementById(pfx + 'Categoria');
  if(!input || !salida) return;
  const edad = calcularEdad(input.value);
  if(edad === null){ salida.innerHTML = ''; return; }
  const cat = categoriaPorEdad(edad);
  if(!cat){ salida.innerHTML = ''; return; }
  salida.innerHTML = `<span class="cat-badge" style="background:${fondoCategoria(cat)};">${cat.letra}</span>
    <span style="margin-left:7px;">Categoría ${cat.letra} · ${cat.label} (${edad} años al ${CONFIG.fechaCorteEdad})</span>`;
}

function tipoRelacionPorId(id){
  return TIPOS_RELACION.find(t => t.id === id) || null;
}

// Texto legible para mostrar en nóminas, fichas y la revisión del administrador.
function etiquetaRelacion(ficha){
  const t = tipoRelacionPorId(ficha && ficha.tipoRelacion);
  if(!t) return '—';
  return ficha.relacionDetalle ? `${t.label} (${ficha.relacionDetalle})` : t.label;
}

// Version corta, para tablas angostas.
function etiquetaRelacionCorta(ficha){
  const t = tipoRelacionPorId(ficha && ficha.tipoRelacion);
  if(!t) return '—';
  const corto = { ex_alumno:'Ex alumno', papa_arcos:'Papá · Los Arcos', papa_hermano:'Papá · C. Hermano',
                  profesor:'Profesor', invitado:'Invitado', otro:'Otro' }[t.id];
  return ficha.relacionDetalle ? `${corto} (${ficha.relacionDetalle})` : corto;
}

      </select>

// Deja la UI consistente con el tipo elegido y precarga el detalle guardado.
function actualizarCamposRelacion(pfx, fichaPrevia){
  const tipo = document.getElementById(pfx + 'Relacion').value;
  const t = tipoRelacionPorId(tipo);
  const campoDetalle = document.getElementById(pfx + 'RelacionDetalleCampo');
  const campoColegio = document.getElementById(pfx + 'RelacionColegioCampo');
  const inputDetalle = document.getElementById(pfx + 'RelacionDetalle');
  const selColegio = document.getElementById(pfx + 'RelacionColegio');
  const labelDetalle = document.getElementById(pfx + 'RelacionDetalleLabel');

  campoDetalle.style.display = 'none';
  campoColegio.style.display = 'none';
  if(!t) return;

  if(t.opciones){
    // Colegio hermano: lista fija y, si eligen "Otro", un texto libre.
    campoColegio.style.display = 'block';
    if(fichaPrevia && fichaPrevia.relacionDetalle){
      const conocido = t.opciones.includes(fichaPrevia.relacionDetalle);
      selColegio.value = conocido ? fichaPrevia.relacionDetalle : 'Otro';
      if(!conocido) inputDetalle.value = fichaPrevia.relacionDetalle;
    }
    if(selColegio.value === 'Otro'){
      campoDetalle.style.display = 'block';
      labelDetalle.textContent = '¿Cuál colegio?';
      inputDetalle.placeholder = 'Nombre del colegio';
    }
  }else if(t.detalle){
    campoDetalle.style.display = 'block';
    labelDetalle.textContent = t.detalle;
    inputDetalle.placeholder = t.placeholder || '';
    if(fichaPrevia && fichaPrevia.relacionDetalle) inputDetalle.value = fichaPrevia.relacionDetalle;
  }
}

/* =========================================================================
   CAMISETAS
   El número es opcional ("si no estás seguro, déjalo en blanco"), pero no
   puede repetirse dentro de un equipo. Se verifica leyendo la plantilla justo
   al guardar, no la lista que se veía al abrir el formulario.
   ========================================================================= */
const ERROR_FORMATO_CAMISETA = 'La camiseta debe ser un número entre 1 y 99. Si no estás seguro, déjala en blanco.';

function leerNumeroCamiseta(raw){
  const t = String(raw ?? '').trim();
  if(t === '') return { ok: true, numero: null };
  if(!/^\d{1,2}$/.test(t)) return { ok: false, error: ERROR_FORMATO_CAMISETA };
  const n = Number(t);
  if(n < 1 || n > 99) return { ok: false, error: ERROR_FORMATO_CAMISETA };
  return { ok: true, numero: n };
}

// Números ya tomados en un equipo: Map número -> [{id, nombre}].
// `excluir` = { ids:[...], uid } evita que alguien choque consigo mismo al
// editar su propia ficha o reenviarla.
async function camisetasOcupadas(equipoId, excluir){
  const ex = excluir || {};
  const snap = await db.collection('jugadores').where('equipoId', '==', equipoId).get();
  const mapa = new Map();
  snap.docs.forEach(d => {
    const j = d.data();
    if((ex.ids || []).includes(d.id)) return;
    if(ex.uid && j.uid === ex.uid) return;
    if(j.numero === null || j.numero === undefined || j.numero === '') return;
    const n = Number(j.numero);
    if(!Number.isInteger(n)) return;
    if(!mapa.has(n)) mapa.set(n, []);
    mapa.get(n).push({ id: d.id, nombre: j.nombre || '' });
  });
  return mapa;
}

async function validarCamiseta(equipoId, raw, excluir){
  const r = leerNumeroCamiseta(raw);
  if(!r.ok || r.numero === null) return r;          // en blanco no necesita consulta
  const ocupadas = await camisetasOcupadas(equipoId, excluir);
  if(ocupadas.has(r.numero)){
    return { ok: false, ocupada: true, numero: r.numero, duenio: ocupadas.get(r.numero)[0].nombre };
  }
  return { ok: true, numero: r.numero };
}

// Ayuda en vivo bajo el campo: qué números están tomados y si el escrito sirve.
const _camisetasVivo = {};
async function prepararCamisetas(prefijo, equipoId, excluir){
  try{
    _camisetasVivo[prefijo] = await camisetasOcupadas(equipoId, excluir);
    revisarCamisetaEnVivo(prefijo);
  }catch(e){ /* sin conexión: se valida igual al guardar */ }
}

function revisarCamisetaEnVivo(prefijo){
  const hint = document.getElementById(prefijo + 'NumeroHint');
  const campo = document.getElementById(prefijo + 'Numero');
  if(!hint || !campo) return;
  const mapa = _camisetasVivo[prefijo];
  const r = leerNumeroCamiseta(campo.value);
  let estado = '';
  if(!r.ok) estado = `<span class="cam-mal">Debe ser un número entre 1 y 99.</span>`;
  else if(r.numero !== null && mapa && mapa.has(r.numero)) estado = `<span class="cam-mal">El ${r.numero} ya está tomado en el equipo.</span>`;
  else if(r.numero !== null && mapa) estado = `<span class="cam-ok">✓ Disponible</span>`;
  const ocupados = mapa ? [...mapa.keys()].sort((a, b) => a - b) : [];
  hint.innerHTML = `${estado ? estado + '<br>' : ''}Opcional: si no estás seguro, déjalo en blanco.${
    ocupados.length ? `<div class="cam-ocup">Ya tomados: ${ocupados.join(', ')}</div>` : ''}`;
}

// Camisetas repetidas dentro de una plantilla (datos viejos, o dos personas que
// eligieron el mismo número a la vez): se muestran para que se corrijan.
function camisetasRepetidas(jugadores){
  const por = {};
  jugadores.forEach(j => {
    if(j.numero === null || j.numero === undefined || j.numero === '') return;
    const n = Number(j.numero);
    if(!Number.isInteger(n)) return;
    (por[n] = por[n] || []).push(j.nombre || 'Sin nombre');
  });
  return Object.entries(por).filter(([n, l]) => l.length > 1)
    .map(([n, l]) => ({ numero: Number(n), nombres: l })).sort((a, b) => a.numero - b.numero);
}

function leerRelacion(pfx, obligatorio){
  const tipo = document.getElementById(pfx + 'Relacion').value;
  if(!tipo){
    return obligatorio
      ? { ok:false, error:'Elige tu tipo de relación con el colegio.' }
      : { ok:true, tipoRelacion:null, relacionDetalle:null };
  }
  const t = tipoRelacionPorId(tipo);
  let detalle = null;

  if(t.opciones){
    const colegio = document.getElementById(pfx + 'RelacionColegio').value;
    if(colegio === 'Otro'){
      detalle = document.getElementById(pfx + 'RelacionDetalle').value.trim();
      if(!detalle) return { ok:false, error:'Escribe el nombre del colegio.' };
    }else{
      detalle = colegio;
    }
  }else if(t.detalle){
    detalle = document.getElementById(pfx + 'RelacionDetalle').value.trim();
    if(!detalle) return { ok:false, error:`Completa el campo "${t.detalle}".` };
  }
  return { ok:true, tipoRelacion:tipo, relacionDetalle:detalle };
}

/* =========================================================================
   ONBOARDING DEL JUGADOR — ficha obligatoria con selfie y cédula
   ========================================================================= */

// Las fotos se guardan comprimidas dentro de Firestore (no en Storage, que
// requiere plan de pago). Un documento de Firestore admite hasta 1 MB, asi que
// cada imagen se reduce por debajo de ~380 KB antes de guardarla.
const MAX_BYTES_FOTO = 380 * 1024;

let onboardingFotos = { selfie: null, cedula: null };

// Carga la imagen respetando la orientación EXIF. Las fotos verticales de
// celular traen esa marca y, sin esto, algunos navegadores las dibujan rotadas.
function cargarImagen(file){
  return new Promise(async (resolve, reject) => {
    if(typeof createImageBitmap === 'function'){
      try{
        const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
        return resolve(bmp);
      }catch(e){ /* navegador viejo o sin soporte de la opción: usamos el plan B */ }
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('No se pudo procesar la imagen. Intenta tomar la foto de nuevo desde la cámara.'));
      img.onload = () => resolve(img);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function comprimirImagen(file, maxDim = 900, maxBytes = MAX_BYTES_FOTO){
  if(!file) throw new Error('No se seleccionó ningún archivo.');
  if(!file.type || !file.type.startsWith('image/')){
    throw new Error('El archivo no es una imagen. Usa una foto en formato JPG o PNG.');
  }

  const img = await cargarImagen(file);
  try{
    const dibujar = (escala, calidad) => {
      const w = Math.max(1, Math.round(img.width * escala));
      const h = Math.max(1, Math.round(img.height * escala));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';   // evita fondo negro si el PNG tiene transparencia
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      return canvas.toDataURL('image/jpeg', calidad);
    };

    let escala = Math.min(1, maxDim / Math.max(img.width, img.height));
    let calidad = 0.78;
    let out = dibujar(escala, calidad);

    // Primero se sacrifica calidad; recién después se reduce el tamaño.
    while(out.length > maxBytes && calidad > 0.4){
      calidad -= 0.09;
      out = dibujar(escala, calidad);
    }
    while(out.length > maxBytes && escala > 0.3){
      escala *= 0.75;
      out = dibujar(escala, 0.6);
    }
    if(out.length > maxBytes){
      throw new Error('La imagen sigue siendo muy pesada. Intenta con una foto más simple o con menos resolución.');
    }
    return out;
  }finally{
    if(img.close) img.close();   // libera el ImageBitmap en cualquier caso
  }
}

async function cargarFoto(input, tipo){
  const file = input.files && input.files[0];
  input.value = ''; // permite volver a elegir el mismo archivo
  if(!file) return;

  const slot = document.getElementById(tipo === 'selfie' ? 'slotSelfie' : 'slotCedula');
  const previo = slot.innerHTML;
  slot.insertAdjacentHTML('beforeend', '<div class="foto-procesando"><div class="loader"></div></div>');

  try{
    const dataUrl = await comprimirImagen(file);
    onboardingFotos[tipo] = dataUrl;
    slot.classList.add('cargada');
    slot.innerHTML = `<img src="${dataUrl}" alt="${tipo === 'selfie' ? 'Selfie' : 'Cédula'}">
                      <div class="foto-cambiar">Toca para cambiar</div>`;
    mostrarErrorOnboarding('');
  }catch(e){
    slot.innerHTML = previo;
    mostrarErrorOnboarding(e.message);
  }
}

function mostrarErrorOnboarding(msg){
  const el = document.getElementById('obError');
  if(el) el.innerHTML = msg ? `<div class="auth-error">${escapeHtml(msg)}</div>` : '';
}

async function enviarFichaOnboarding(){
  const nombre = formatearNombre(document.getElementById('obNombre').value);
  const cedula = armarCedula(document.getElementById('obCedulaLetra').value,
                             document.getElementById('obCedula').value);
  const telefono = formatearTelefono(document.getElementById('obTelefono').value);
  const emgTel = formatearTelefono(document.getElementById('obEmergenciaTel').value);

  if(!nombre){ mostrarErrorOnboarding('Escribe tu nombre completo.'); return; }
  if(!cedula){ mostrarErrorOnboarding('Escribe tu número de cédula.'); return; }
  if(!cedulaValida(cedula)){ mostrarErrorOnboarding('La cédula debe tener entre 6 y 9 dígitos.'); return; }
  if(!telefono){ mostrarErrorOnboarding('Escribe tu teléfono de contacto.'); return; }
  if(!telefonoValido(telefono)){ mostrarErrorOnboarding('El teléfono debe tener 11 dígitos, por ejemplo 0414-1234567.'); return; }
  if(emgTel && !telefonoValido(emgTel)){ mostrarErrorOnboarding('El teléfono de emergencia debe tener 11 dígitos.'); return; }
  const fechaNac = document.getElementById('obFecha').value;
  if(!fechaNac){ mostrarErrorOnboarding('Falta tu fecha de nacimiento: define tu categoría por edad.'); return; }
  if(calcularEdad(fechaNac) === null){ mostrarErrorOnboarding('Revisa la fecha de nacimiento, no parece válida.'); return; }
  const rel = leerRelacion('ob', true);
  if(!rel.ok){ mostrarErrorOnboarding(rel.error); return; }
  if(!onboardingFotos.selfie){ mostrarErrorOnboarding('Falta la selfie.'); return; }
  if(!onboardingFotos.cedula){ mostrarErrorOnboarding('Falta la foto de la cédula.'); return; }

  const btn = document.getElementById('obEnviar');
  btn.disabled = true;
  btn.textContent = 'Enviando…';
  mostrarErrorOnboarding('');

  // Camiseta: opcional, pero no puede repetirse en el equipo. Se lee la base
  // AHORA: la lista de números tomados que se veía al abrir el formulario pudo
  // quedar vieja si un compañero eligió ese número mientras tanto.
  let cam;
  try{
    cam = await validarCamiseta(currentProfile.equipoId, document.getElementById('obNumero').value,
      { ids: [currentProfile.jugadorId].filter(Boolean), uid: currentUser.uid });
  }catch(e){
    cam = { ok: false, error: 'No se pudo verificar el número de camiseta. Revisa tu conexión, o déjalo en blanco.' };
  }
  if(!cam.ok){
    btn.disabled = false;
    btn.textContent = 'Enviar ficha para revisión';
    mostrarErrorOnboarding(cam.ocupada
      ? `El número ${cam.numero} ya lo tiene otro jugador de tu equipo. Elige otro, o déjalo en blanco si no estás seguro.`
      : cam.error);
    const campo = document.getElementById('obNumero');
    if(campo){ campo.focus(); }
    return;
  }

  const ficha = {
    uid: currentUser.uid,
    equipoId: currentProfile.equipoId,
    nombre,
    cedula,
    fechaNacimiento: fechaNac,
    numero: cam.numero,
    posicion: document.getElementById('obPosicion').value,
    telefono,
    contactoEmergenciaNombre: formatearNombre(document.getElementById('obEmergenciaNombre').value),
    contactoEmergenciaTelefono: emgTel,
    tipoRelacion: rel.tipoRelacion,
    relacionDetalle: rel.relacionDetalle,
    estado: EST.EN_REVISION,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try{
    // 1) Ficha deportiva (la ve todo el mundo en la nómina del equipo)
    let jugadorId = currentProfile.jugadorId;
    if(jugadorId){
      await db.collection('jugadores').doc(jugadorId).update(ficha);
    }else{
      ficha.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      const ref = await db.collection('jugadores').add(ficha);
      jugadorId = ref.id;
    }

    // 2) Documentos de identidad, en coleccion aparte y de acceso restringido
    await db.collection('documentos').doc(currentUser.uid).set({
      uid: currentUser.uid,
      jugadorId,
      selfie: onboardingFotos.selfie,
      cedula: onboardingFotos.cedula,
      enviadoEl: firebase.firestore.FieldValue.serverTimestamp()
    });

    // 3) Miniatura para nóminas y alineaciones
    try{
      await guardarMiniatura(jugadorId, currentUser.uid, onboardingFotos.selfie);
    }catch(e){ console.warn('No se pudo generar la miniatura:', e); }

    // 4) La cuenta pasa a revisión
    await db.collection('users').doc(currentUser.uid).update({
      estado: EST.EN_REVISION,
      jugadorId,
      motivoRechazo: firebase.firestore.FieldValue.delete()
    });
    // El listener de users vuelve a enrutar solo.
  }catch(e){
    btn.disabled = false;
    btn.textContent = 'Enviar ficha para revisión';
    mostrarErrorOnboarding('No se pudo enviar: ' + e.message);
  }
}

/* =========================================================================
   BOOT
   ========================================================================= */
initFirebase();

/* =========================================================================
   AVISO DE VERSIÓN NUEVA
   Una app instalada no se recarga sola mientras sigue abierta en segundo
   plano: quien no la cierra del todo puede quedarse semanas con el código
   viejo y no ver las funciones nuevas. Acá la app compara su versión con la
   publicada y avisa cuando hay una más nueva.
   ========================================================================= */
let _avisoVersionVisible = false;
let _ultimaRevisionVersion = 0;

async function revisarVersionNueva(forzar){
  if(_avisoVersionVisible) return;
  const ahora = Date.now();
  // Como mucho una vez por minuto, para no gastar datos al ir y venir de la app.
  if(!forzar && ahora - _ultimaRevisionVersion < 60000) return;
  _ultimaRevisionVersion = ahora;
  try{
    // no-store: se pide siempre al servidor, nunca a la memoria del teléfono.
    const r = await fetch(location.pathname + '?rv=' + ahora, { cache: 'no-store' });
    if(!r.ok) return;
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if(m && m[1] !== APP_VERSION) mostrarAvisoVersion(m[1]);
  }catch(e){
    // Sin conexión, o abierta desde un archivo local: no pasa nada.
  }
}

function mostrarAvisoVersion(nueva){
  _avisoVersionVisible = true;
  const el = document.createElement('div');
  el.className = 'aviso-version';
  el.id = 'avisoVersion';
  el.innerHTML = `
    <span>Hay una versión nueva</span>
    <button type="button" class="av-actualizar" onclick="aplicarActualizacion()">Actualizar</button>
    <button type="button" class="av-luego" onclick="posponerActualizacion()" aria-label="Recordármelo luego">✕</button>`;
  document.body.appendChild(el);
}

async function aplicarActualizacion(){
  const b = document.querySelector('#avisoVersion .av-actualizar');
  if(b){ b.disabled = true; b.textContent = 'Actualizando…'; }
  // cache:'reload' renueva la copia guardada del navegador; sin esto, el
  // reload podía volver a servir el archivo viejo.
  try{ await fetch(location.pathname, { cache: 'reload' }); }catch(e){}
  location.reload();
}

function posponerActualizacion(){
  const el = document.getElementById('avisoVersion');
  if(el) el.remove();
  _avisoVersionVisible = false;
  // Vuelve a avisar en unos 5 minutos, no en el próximo cambio de pantalla.
  _ultimaRevisionVersion = Date.now() + 4 * 60000;
}

// Al abrir, al volver a la app desde segundo plano, al recuperar conexión, y cada 20 min.
setTimeout(() => revisarVersionNueva(true), 4000);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') revisarVersionNueva();
});
window.addEventListener('online', () => revisarVersionNueva());
setInterval(() => revisarVersionNueva(), 20 * 60000);

// Service worker: habilita la instalacion en pantalla de inicio.
// Estrategia network-first a proposito: mientras la app este en desarrollo activo
// no queremos servir versiones cacheadas viejas.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('Service worker no registrado (normal si abris el archivo local):', err);
    });
  });
}
