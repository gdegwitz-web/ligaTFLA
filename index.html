      }else if(currentProfile.rol === ROLES.LIGA_ADMIN){
        // Override de administrador: sirve para probar el flujo y para cuando

        miValidacionBoton = `
          <button class="btn btn-sm ${acta.validadoLocal?'btn-secondary':'btn-primary'}" ${acta.validadoLocal?'disabled':''} onclick="validarActa('${pDoc.id}', true)">
            ${acta.validadoLocal ? '✓ ' + escapeHtml(local) : 'Validar por ' + escapeHtml(local)}
          </button>
          <button class="btn btn-sm ${acta.validadoVisitante?'btn-secondary':'btn-primary'}" ${acta.validadoVisitante?'disabled':''} onclick="validarActa('${pDoc.id}', false)">
            ${acta.validadoVisitante ? '✓ ' + escapeHtml(visitante) : 'Validar por ' + escapeHtml(visitante)}
          </button>`;
      }

      cards.push(`
        <div class="acta-card">
          <div class="acta-head">
            <div>
              <div class="jornada">Jornada ${p.jornada ?? '—'} · Árbitro: ${escapeHtml(acta.arbitroNombre||'—')}</div>
              <div class="matchup">${escapeHtml(local)} ${acta.golesLocal ?? 0} — ${acta.golesVisitante ?? 0} ${escapeHtml(visitante)}</div>
            </div>
            <span class="acta-status ${acta.validadoLocal && acta.validadoVisitante ? 'status-validado' : 'status-pendiente'}">
              ${acta.validadoLocal && acta.validadoVisitante ? 'Ambos validaron' : `Local: ${acta.validadoLocal?'✓':'—'} · Visitante: ${acta.validadoVisitante?'✓':'—'}`}
            </span>
          </div>
          <div class="acta-body">
            ${incRows}

async function validarActa(partidoId, esLocal){
  try{
    const previa = await db.collection('actas').doc(partidoId).get();
    if(actaEstaCerrada(previa.exists ? previa.data() : null)){
      toast('El acta ya está cerrada: ya no admite cambios', 'error');
      return;
    }
    const field = esLocal ? 'validadoLocal' : 'validadoVisitante';
    const porField = esLocal ? 'validadoLocalPor' : 'validadoVisitantePor';
    await db.collection('actas').doc(partidoId).update({
      [field]: true,
      [porField]: currentProfile.nombre + (currentProfile.rol === ROLES.LIGA_ADMIN ? ' (admin)' : ''),
      [porField + 'Fecha']: new Date().toISOString(),
      [porField + 'Uid']: currentUser.uid
    });

    const actaDoc = await db.collection('actas').doc(partidoId).get();
    const acta = actaDoc.data();
    if(acta.validadoLocal && acta.validadoVisitante){
      // Con las dos firmas el partido se cierra. enDisputa:false limpia una
      // objeción anterior que ya quedó resuelta.
      await db.collection('partidos').doc(partidoId).update({ estado: 'validado', enDisputa: false });
      toast('Acta validada por ambos equipos — queda cerrada y oficial', 'success');
    }else{
      toast('Validación registrada, falta el otro equipo', 'success');
    }
    renderValidaciones();
  }catch(e){
    toast(mensajeDeEscritura(e), 'error');
  }
}

async function objetarActa(partidoId){
  const previa = await db.collection('actas').doc(partidoId).get();
  if(actaEstaCerrada(previa.exists ? previa.data() : null)){
    toast('El acta ya está cerrada: ya no se puede objetar', 'error');
    return;
  }
  const motivo = prompt('Describe brevemente la objeción (el árbitro deberá corregir el acta):');
  if(motivo === null) return;
  try{
    await db.collection('partidos').doc(partidoId).update({ estado: 'jugado', enDisputa: true });
    await db.collection('actas').doc(partidoId).update({
      objeciones: firebase.firestore.FieldValue.arrayUnion({
        motivo, por: currentProfile.nombre, equipoId: currentProfile.equipoId,
        fecha: new Date().toISOString()
      })
    });
    toast('Objeción registrada', 'success');
    renderValidaciones();
  }catch(e){
    toast(mensajeDeEscritura(e), 'error');
  }
}

/* =========================================================================
   MINIATURA DEL JUGADOR
   La selfie completa vive en 'documentos', que solo ven el administrador y
   los delegados que validan. Para las nóminas y alineaciones se guarda
   aparte una miniatura liviana: así un árbitro puede confirmar de un vistazo
   que quien está en cancha es quien figura en la lista, sin que abrir una
   plantilla de quince jugadores descargue varios megas.
   ========================================================================= */
const MINIATURA_DIM = 220;
const MINIATURA_BYTES = 16 * 1024;

// Reduce una imagen ya cargada (dataURL) a una miniatura cuadrada.
function hacerMiniatura(dataUrl, dim = MINIATURA_DIM){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => reject(new Error('No se pudo procesar la foto'));
    img.onload = () => {
      // Recorte cuadrado centrado, con un leve sesgo hacia arriba: en una
      // selfie la cara casi nunca está en el centro exacto.
      const lado = Math.min(img.width, img.height);
      const sx = (img.width - lado) / 2;
      const sy = Math.max(0, (img.height - lado) / 2 - lado * 0.08);
      const c = document.createElement('canvas');
      c.width = c.height = dim;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, dim, dim);
      ctx.drawImage(img, sx, sy, lado, lado, 0, 0, dim, dim);
      let q = 0.72, out = c.toDataURL('image/jpeg', q);
      while(out.length > MINIATURA_BYTES && q > 0.3){
        q -= 0.08;
        out = c.toDataURL('image/jpeg', q);
      }
      resolve(out);
    };
    img.src = dataUrl;
  });
}

async function guardarMiniatura(jugadorId, uid, dataUrl){
  const mini = await hacerMiniatura(dataUrl);
  await db.collection('fotos').doc(jugadorId).set({
    jugadorId, uid: uid || null, miniatura: mini,
    actualizadaEl: new Date().toISOString()
  });
  return mini;
}

// Las fotos son para verificar identidad: las ven delegados, árbitros y la
// administración. Un jugador cualquiera no necesita ver la cara de los demás.
function puedeVerFotos(){
  if(!currentProfile) return false;
  return [ROLES.LIGA_ADMIN, ROLES.DELEGADO, ROLES.ARBITRO].includes(currentProfile.rol);
}

let _fotosCache = {};
// Si Firestore rechaza la lectura no es que falten fotos: es que faltan las
// reglas de seguridad. Sin este aviso los dos casos se ven idénticos (círculos
// con iniciales) y no hay forma de saber cuál es el problema.
let _fotosBloqueadas = false;
async function cargarFotos(jugadorIds){
  if(!puedeVerFotos()) return {};
  const faltan = [...new Set(jugadorIds)].filter(id => id && !(id in _fotosCache));
  await Promise.all(faltan.map(async id => {
    try{
      const d = await db.collection('fotos').doc(id).get();
      _fotosCache[id] = d.exists ? (d.data().miniatura || null) : null;
    }catch(e){
      if(e && e.code === 'permission-denied'){ _fotosBloqueadas = true; }
      else{ _fotosCache[id] = null; }
    }
  }));
  const r = {};
  jugadorIds.forEach(id => { if(id) r[id] = _fotosCache[id] || null; });
  return r;
}
function invalidarFoto(jugadorId){ delete _fotosCache[jugadorId]; }

// Avatar redondo; si no hay foto, las iniciales del jugador.
function avatarJugador(foto, nombre, tam){
  const t = tam || 38;
  if(foto){
    return `<img class="avatar-jug" src="${foto}" alt="" style="width:${t}px;height:${t}px;">`;
  }
  const ini = (nombre || '?').trim().split(/\s+/).slice(0,2).map(x => x[0] || '').join('').toUpperCase();
  return `<span class="avatar-jug sin-foto" style="width:${t}px;height:${t}px;font-size:${Math.round(t*0.36)}px;">${escapeHtml(ini)}</span>`;
}

/* ---------- Generar miniaturas de quienes ya tenían ficha ----------
   Las miniaturas solo se crean al enviar una ficha nueva o al validarla. Los
   jugadores aprobados antes de que existiera esta función no pasaron por ahí,
   así que se les genera acá, a partir de la selfie que ya está guardada. */
async function generarMiniaturasFaltantes(jugadores, alFinalizar){
  const fotos = await cargarFotos(jugadores.map(j => j.id));
  const faltan = jugadores.filter(j => !fotos[j.id]);
  const sinCuenta = faltan.filter(j => !j.uid);          // cargados a mano: no hay selfie
  const candidatos = faltan.filter(j => j.uid);

  let hechas = 0, sinSelfie = 0, fallidas = 0, denegadas = 0;
  const btn = document.getElementById('btnMiniaturas');
  for(let i = 0; i < candidatos.length; i++){
    const j = candidatos[i];
    if(btn) btn.textContent = `Generando… ${i + 1} de ${candidatos.length}`;
    try{
      const d = await db.collection('documentos').doc(j.uid).get();
      if(!d.exists || !d.data().selfie){ sinSelfie++; continue; }
      await guardarMiniatura(j.id, j.uid, d.data().selfie);
      invalidarFoto(j.id);
      hechas++;
    }catch(e){
      if(e && e.code === 'permission-denied') denegadas++; else fallidas++;
      console.warn('miniatura', j.nombre, e);
    }
  }

  if(denegadas){
    toast('Firestore rechazó guardar las fotos: falta publicar las reglas nuevas (firestore.rules)', 'error');
    if(alFinalizar) alFinalizar();
    return;
  }

  const partes = [];
  if(hechas) partes.push(`${hechas} generada${hechas===1?'':'s'}`);
  if(sinSelfie) partes.push(`${sinSelfie} sin selfie guardada`);
  if(sinCuenta.length) partes.push(`${sinCuenta.length} cargado${sinCuenta.length===1?'':'s'} a mano (súbeles la foto desde Editar)`);
  if(fallidas) partes.push(`${fallidas} fallaron`);
  toast(partes.join(' · ') || 'No había nada que generar', fallidas ? 'error' : 'success');
  if(alFinalizar) alFinalizar();
}

    return `<div class="card" style="border-left:4px solid var(--card-red); padding:16px 18px;">

  return `<div class="card" style="border-left:4px solid var(--sand); padding:16px 18px;">

    <p style="font-size:13px; color:var(--ink-soft); line-height:1.5; margin:6px 0 12px;">
      Si ya se registraron con su selfie, la foto se puede generar desde la que tienen guardada.
      Los que cargaste a mano necesitan que les subas una desde <b>Editar</b>.
    </p>
    <button class="btn btn-sm btn-primary" id="btnMiniaturas" onclick="dispararMiniaturas()">Generar fotos faltantes</button>

async function dispararMiniaturas(){
  const btn = document.getElementById('btnMiniaturas');
  if(btn) btn.disabled = true;
  try{
    let jugs;
    if(currentProfile.rol === ROLES.LIGA_ADMIN){
      const s = await db.collection('jugadores').get();

    if(btn) btn.disabled = false;
  }
}

/* =========================================================================
   ALINEACIÓN INICIAL
   Reglas de la liga para que una alineación sea válida:
     1) 11 jugadores, o 12 si entre ellos hay al menos uno de categoría E
     2) máximo 1 de categoría A y máximo 2 de categoría B
     3) D + E >= A + B  (por cada joven en cancha, un veterano)
     4) categoría C sin restricción
   El delegado la arma, la app la valida, y el árbitro la aprueba antes del
   partido. Sin categoría asignada no se puede validar a nadie.
   ========================================================================= */
function contarPorCategoria(jugadores){
  const c = { A:0, B:0, C:0, D:0, E:0, sin:0 };
  const letras = { menor_35:'A', de_35_39:'B', de_40_47:'C', de_48_59:'D', de_60_mas:'E' };
  jugadores.forEach(j => {
    const r = categoriaDeFicha(j);
    const l = r && r.categoria ? letras[r.categoria.id] : null;
    if(l) c[l]++; else c.sin++;
  });
  return c;
}

function validarAlineacion(jugadores){
  const c = contarPorCategoria(jugadores);
  const total = jugadores.length;
  const jovenes = c.A + c.B;
  const veteranos = c.D + c.E;

  const reglas = [
    { ok: c.sin === 0,
      titulo: 'Todos con categoría asignada',
      detalle: c.sin === 0 ? 'Listo'
        : `${c.sin} jugador${c.sin===1?'':'es'} sin fecha de nacimiento` },

    { ok: total === 11 || (total === 12 && c.E >= 1),
      titulo: '11 jugadores, o 12 con un categoría E',
      detalle: total === 11 ? '11 en cancha'
        : total === 12 ? (c.E >= 1 ? '12 en cancha, habilitado por el jugador E'
                                   : '12 en cancha, pero ninguno es categoría E')
        : `${total} en cancha` },

    { ok: c.A <= 1,
      titulo: 'Máximo 1 de categoría A',
      detalle: `${c.A} en cancha` },

    { ok: c.B <= 2,
      titulo: 'Máximo 2 de categoría B',
      detalle: `${c.B} en cancha` },

    { ok: veteranos >= jovenes,
      titulo: 'Tantos D y E como A y B',
      detalle: `A+B = ${jovenes} · D+E = ${veteranos}` +
               (veteranos < jovenes ? ` · faltan ${jovenes - veteranos}` : '') },
  ];

  return { conteo: c, total, reglas, ok: reglas.every(r => r.ok) };
}

/* ---------- Delegado: montar la alineación ---------- */
let _alineacionJugadores = [];

async function abrirAlineacion(partidoId){
  openModal('<h3>Alineación inicial</h3><div class="loader"></div>');
  try{
    const equipoId = currentProfile.equipoId;
    const [jugSnap, conv, alin, pDoc] = await Promise.all([
      db.collection('jugadores').where('equipoId','==',equipoId).get(),
      leerConvocatoria(partidoId, equipoId),
      leerAlineacion(partidoId, equipoId),
      db.collection('partidos').doc(partidoId).get()
    ]);

    let jugadores = jugSnap.docs.map(d => ({id:d.id, ...d.data()}));
    const convocados = conv && conv.jugadorIds && conv.jugadorIds.length ? new Set(conv.jugadorIds) : null;
    if(convocados) jugadores = jugadores.filter(j => convocados.has(j.id));
    jugadores.sort(ordenarPlantilla);

    if(jugadores.length === 0){
      openModal(`<h3>Alineación inicial</h3>
        <div class="empty-state">${convocados ? 'La convocatoria está vacía.' : 'Tu plantilla está vacía.'}</div>`);
      return;
    }

    _alineacionJugadores = jugadores;
    const fotosAlin = await cargarFotos(jugadores.map(j => j.id));
    const yaElegidos = new Set((alin && alin.jugadorIds) || []);
    const p = pDoc.data();
    const rival = await getEquipoNombre(p.equipoLocalId === equipoId ? p.equipoVisitanteId : p.equipoLocalId);

    openModal(`
      <h3>Alineación vs ${escapeHtml(rival)}</h3>
      <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:6px;">
        ${convocados ? 'Elige entre los convocados quiénes arrancan el partido.'
                     : 'No cargaste convocatoria, así que aparece toda la plantilla.'}
      </p>

      <div id="alinPanel" class="alin-panel"></div>

      <div id="alinLista" style="margin-top:14px;">
        ${jugadores.map(j => {
          const r = categoriaDeFicha(j);
          return `<label class="conv-fila">
            <input type="checkbox" class="alin-check" value="${j.id}" ${yaElegidos.has(j.id)?'checked':''}
                   onchange="refrescarPanelAlineacion()">
            ${avatarJugador(fotosAlin[j.id], j.nombre, 36)}
            <span style="margin:0 8px;">${badgeCategoriaHtml(j)}</span>
            <span style="flex:1; margin-left:9px; min-width:0;">
              <b>#${j.numero ?? '—'}</b> ${escapeHtml(j.nombre)}
              <span style="color:var(--ink-soft); font-size:13px;"> · ${escapeHtml(j.posicion || '')}</span>
              ${!r || !r.categoria ? '<span class="badge" style="margin-left:6px;">sin categoría</span>' : ''}
            </span>
          </label>`;
        }).join('')}
      </div>

      <button class="btn btn-primary btn-block" style="margin-top:16px;" id="btnAlineacion"
              onclick="guardarAlineacion('${partidoId}')">Enviar al árbitro</button>
    `);
    refrescarPanelAlineacion();
  }catch(e){
    openModal(`<h3>Alineación inicial</h3><div class="empty-state">Error: ${escapeHtml(e.message)}</div>`);
  }
}

function refrescarPanelAlineacion(){
  const ids = new Set([...document.querySelectorAll('.alin-check:checked')].map(x => x.value));
  const elegidos = _alineacionJugadores.filter(j => ids.has(j.id));
  const v = validarAlineacion(elegidos);

  const panel = document.getElementById('alinPanel');
  if(panel){
    panel.innerHTML = `
      <div class="alin-cabecera ${v.ok?'ok':'no'}">
        <div>
          <div class="alin-total">${v.total}</div>
          <div class="alin-total-lbl">en cancha</div>
        </div>
        <div style="flex:1; min-width:0;">
          ${tablaCategoriasHtml(v.conteo)}
        </div>
        <div class="alin-veredicto">${v.ok ? 'Válida' : 'No válida'}</div>
      </div>
      ${reglasAlineacionHtml(v)}`;
  }
  const btn = document.getElementById('btnAlineacion');
  if(btn){
    btn.disabled = !v.ok;
    btn.textContent = v.ok ? 'Enviar al árbitro' : 'La alineación todavía no cumple las reglas';
  }
}

async function guardarAlineacion(partidoId){
  const ids = [...document.querySelectorAll('.alin-check:checked')].map(x => x.value);
  const elegidos = _alineacionJugadores.filter(j => ids.includes(j.id));
  const v = validarAlineacion(elegidos);
  if(!v.ok){ toast('La alineación no cumple las reglas', 'error'); return; }

  try{
    const equipoNombre = await getEquipoNombre(currentProfile.equipoId);
    await db.collection('alineaciones').doc(idAlineacion(partidoId, currentProfile.equipoId)).set({
      partidoId,
      equipoId: currentProfile.equipoId,
      equipoNombre,
      jugadorIds: ids,
      conteo: v.conteo,
      total: v.total,
      estado: 'enviada',
      cargadaPor: currentProfile.nombre,
      cargadaPorUid: currentUser.uid,
      enviadaEl: new Date().toISOString(),
      // Se limpia cualquier revisión anterior: es una alineación nueva.
      aprobadaPor: null, aprobadaPorUid: null, aprobadaEl: null, motivoRechazo: null
    });
    closeModal();
    toast('Alineación enviada al árbitro', 'success');
    renderMisPartidos();
  }catch(e){ toast('Error: ' + e.message, 'error'); }
}

/* ---------- Árbitro: revisar y aprobar ---------- */
async function bloqueAlineacionesArbitro(partidoId, p, local, visitante){
  const [aLocal, aVis] = await Promise.all([
    leerAlineacion(partidoId, p.equipoLocalId),
    leerAlineacion(partidoId, p.equipoVisitanteId)
  ]);

  const tarjeta = async (alin, equipoId, nombreEq) => {
    if(!alin){
      return `<div class="alin-equipo">
        <div class="alin-equipo-cab"><b>${escapeHtml(nombreEq)}</b>
          <span class="badge">Sin enviar</span></div>
        <div style="font-size:13px; color:var(--ink-faint); margin-top:6px;">
          El delegado todavía no montó la alineación.
        </div>
      </div>`;
    }
    const jugs = await Promise.all((alin.jugadorIds || []).map(async id => {
      const d = await db.collection('jugadores').doc(id).get();
      return d.exists ? {id, ...d.data()} : null;
    }));
    const validos = jugs.filter(Boolean).sort(ordenarPlantilla);
    const fotosArb = await cargarFotos(validos.map(j => j.id));
    const v = validarAlineacion(validos);
    const estado = alin.estado || 'enviada';

    return `<div class="alin-equipo">
      <div class="alin-equipo-cab">
        <b>${escapeHtml(nombreEq)}</b>
        <span class="acta-status ${estado==='aprobada'?'status-validado':estado==='rechazada'?'status-disputa':'status-pendiente'}">
          ${estado==='aprobada'?'Aprobada':estado==='rechazada'?'Devuelta':'Por revisar'}
        </span>
      </div>
      <div class="firma-meta" style="margin:4px 0 10px;">
        Enviada por ${escapeHtml(alin.cargadaPor || '—')}${alin.enviadaEl ? ' · ' + fechaCorta(alin.enviadaEl) : ''}
      </div>
      ${tablaCategoriasHtml(v.conteo)}
      <div style="margin-top:10px;">
        ${validos.map(j => `<div class="alin-fila-mini">
          ${avatarJugador(fotosArb[j.id], j.nombre, 34)}
          <span style="margin:0 8px;">${badgeCategoriaHtml(j)}</span>
          <span><b>#${j.numero ?? '—'}</b> ${escapeHtml(j.nombre)}</span>
        </div>`).join('')}
      </div>
      ${!v.ok ? `<div class="aviso-rechazo" style="margin:12px 0 0;">
        Esta alineación ya no cumple las reglas. Revisa antes de aprobarla.
        ${reglasAlineacionHtml(v)}
      </div>` : ''}
      ${alin.motivoRechazo ? `<div class="mercado-nota" style="margin-top:10px;">Devuelta: ${escapeHtml(alin.motivoRechazo)}</div>` : ''}
      ${estado !== 'aprobada' ? `
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="btn btn-sm btn-primary" onclick="aprobarAlineacion('${partidoId}','${equipoId}')">Aprobar</button>
          <button class="btn btn-sm btn-secondary" onclick="rechazarAlineacion('${partidoId}','${equipoId}')">Devolver</button>
        </div>`
      : `<div class="firma-meta" style="margin-top:10px;">
           Aprobada por ${escapeHtml(alin.aprobadaPor || '—')}${alin.aprobadaEl ? ' · ' + fechaCorta(alin.aprobadaEl) : ''}
         </div>`}
    </div>`;
  };

  const [tLocal, tVis] = await Promise.all([
    tarjeta(aLocal, p.equipoLocalId, local),
    tarjeta(aVis, p.equipoVisitanteId, visitante)
  ]);
  const faltan = !(aLocal && aLocal.estado === 'aprobada') || !(aVis && aVis.estado === 'aprobada');

  return `<div class="card">
    <div class="section-title">Alineaciones iniciales</div>
    ${faltan ? `<div class="auth-note">Las dos alineaciones tienen que estar aprobadas antes de empezar el partido.</div>` : ''}
    <div class="alin-equipos">${tLocal}${tVis}</div>
  </div>`;
}

async function aprobarAlineacion(partidoId, equipoId){
  try{
    await db.collection('alineaciones').doc(idAlineacion(partidoId, equipoId)).update({
      estado: 'aprobada',
      aprobadaPor: currentProfile.nombre,
      aprobadaPorUid: currentUser.uid,
      aprobadaEl: new Date().toISOString(),
      motivoRechazo: null
    });
    toast('Alineación aprobada', 'success');
    abrirActaForm(partidoId);
  }catch(e){ toast('Error: ' + e.message, 'error'); }
}

async function rechazarAlineacion(partidoId, equipoId){
  const motivo = prompt('¿Qué tiene que corregir el delegado?');
  if(motivo === null) return;
  try{
    await db.collection('alineaciones').doc(idAlineacion(partidoId, equipoId)).update({
      estado: 'rechazada',
      motivoRechazo: motivo.trim() || 'El árbitro devolvió la alineación.',
      aprobadaPor: null, aprobadaPorUid: null, aprobadaEl: null
    });
    toast('Alineación devuelta');
    abrirActaForm(partidoId);
  }catch(e){ toast('Error: ' + e.message, 'error'); }
}

   convocar a sus jugadores antes del juego y validar el acta después.

// Un documento por partido y equipo, así los dos delegados nunca escriben
// sobre el mismo registro.
function idConvocatoria(partidoId, equipoId){
  return `${partidoId}_${equipoId}`;
}

async function leerConvocatoria(partidoId, equipoId){
  try{
    const doc = await db.collection('convocatorias').doc(idConvocatoria(partidoId, equipoId)).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ return null; }
}

  const c = document.getElementById('content');
  if(!currentProfile.equipoId){
    c.innerHTML = `<h2>Mis partidos</h2><div class="empty-state">Tu cuenta no tiene un equipo asignado. Contacta al administrador de la liga.</div>`;
    return;
  }
  const equipoNombre = await getEquipoNombre(currentProfile.equipoId);

    <p class="page-sub">${escapeHtml(equipoNombre)} · convoca a tus jugadores antes del juego y valida el acta después</p>

  try{
    const snap = await db.collection('partidos').get();
    const mios = snap.docs.map(d => ({id:d.id, ...d.data()}))
      .filter(p => p.equipoLocalId === currentProfile.equipoId || p.equipoVisitanteId === currentProfile.equipoId)
      .sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));

      document.getElementById('mpArea').innerHTML = '<div class="empty-state">Todavía no hay partidos programados para tu equipo.</div>';

      const rival = esLocal ? visitante : local;
      const fecha = p.fecha ? new Date(p.fecha).toLocaleString('es-VE', {dateStyle:'medium', timeStyle:'short'}) : 'Sin fecha';

      const [conv, alin] = await Promise.all([
        leerConvocatoria(p.id, currentProfile.equipoId),
        leerAlineacion(p.id, currentProfile.equipoId)
      ]);
      const nConv = conv && conv.jugadorIds ? conv.jugadorIds.length : 0;

      // Bloque de convocatoria

        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
          <div style="font-size:14px; min-width:0;">
            ${nConv > 0
              ? `<b>${nConv}</b> jugador${nConv===1?'':'es'} convocado${nConv===1?'':'s'}
                 ${conv.cargadaPor ? `<div class="firma-meta">Cargada por ${escapeHtml(conv.cargadaPor)}${conv.actualizadaElTexto ? ' · ' + fechaCorta(conv.actualizadaElTexto) : ''}</div>` : ''}`
              : '<span style="color:var(--ink-soft);">Sin convocatoria cargada</span>'}
          </div>
          <button class="btn btn-sm ${nConv>0?'btn-secondary':'btn-primary'}" onclick="abrirConvocatoria('${p.id}')">
            ${nConv > 0 ? 'Editar convocatoria' : 'Convocar jugadores'}
          </button>
        </div>

        <hr class="section-divider" style="margin:14px 0;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
          <div style="font-size:14px; min-width:0;">
            ${alin ? `<b>${alin.total}</b> en la alineación
              <span class="acta-status ${alin.estado==='aprobada'?'status-validado':alin.estado==='rechazada'?'status-disputa':'status-pendiente'}"
                    style="margin-left:7px;">
                ${alin.estado==='aprobada'?'Aprobada por el árbitro':alin.estado==='rechazada'?'Devuelta':'Esperando al árbitro'}
              </span>
              ${alin.motivoRechazo ? `<div class="firma-meta" style="margin-top:5px;">${escapeHtml(alin.motivoRechazo)}</div>` : ''}`
            : '<span style="color:var(--ink-soft);">Sin alineación inicial</span>'}
          </div>
          <button class="btn btn-sm ${alin && alin.estado==='aprobada' ? 'btn-secondary' : 'btn-primary'}"
                  onclick="abrirAlineacion('${p.id}')">
            ${alin ? 'Editar alineación' : 'Montar alineación'}
          </button>
        </div>`;

      // Bloque de acta y validación
      let actaBloque = '';

        const actaDoc = await db.collection('actas').doc(p.id).get();
        if(actaDoc.exists){

          actaBloque = `
            <hr class="section-divider" style="margin:14px 0;">

            <div style="font-family:var(--display); font-weight:900; font-size:19px; margin-bottom:10px;">

              ${yaValide
                ? `<span style="font-size:13px; color:var(--ink-soft);">
                     ${otroValido ? 'Acta cerrada: los dos equipos validaron y ya no se puede modificar.' : 'Falta que valide el otro equipo.'}
                   </span>`
                : `<button class="btn btn-sm btn-primary" onclick="abrirValidacionConNota('${p.id}', ${esLocal})">Validar acta</button>
                   <button class="btn btn-sm btn-secondary" onclick="objetarActa('${p.id}')">Objetar</button>`}
            </div>`;
        }else{
          actaBloque = `<hr class="section-divider" style="margin:14px 0;">

      return `<div class="acta-card">
        <div class="acta-head">

        <div class="acta-body">${convocatoria}${actaBloque}</div>

    document.getElementById('mpArea').innerHTML = `<div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }

/* =========================================================================
   IMPORTADOR DE CALENDARIO
   Cargar un torneo entero a mano son decenas de formularios. Acá se pega el
   fixture completo en texto y se crea todo de una, con una vista previa antes
   de escribir nada.
   Formato por línea:  jornada | fecha | hora | local | visitante
   Ej:                 J1 | 2026-11-22 | 08:00 | Rosados FC | Blacks FC
   ========================================================================= */

// Compara nombres ignorando mayúsculas, acentos y sufijos como "FC".
function normalizarNombreEquipo(s){
  return String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/\bf\.?c\.?\b/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

function parsearLineaPartido(linea, equiposPorNombre){
  const partes = linea.split('|').map(x => x.trim());
  if(partes.length < 5) return { error: 'Faltan campos (se esperan 5 separados por |)' };

  const [jRaw, fechaRaw, horaRaw, localRaw, visitanteRaw] = partes;

  const jornada = parseInt(String(jRaw).replace(/[^0-9]/g, ''), 10);
  if(!jornada) return { error: `Jornada inválida: "${jRaw}"` };

  if(!/^\d{4}-\d{2}-\d{2}$/.test(fechaRaw)) return { error: `Fecha inválida: "${fechaRaw}" (usa AAAA-MM-DD)` };
  if(!/^\d{1,2}:\d{2}$/.test(horaRaw)) return { error: `Hora inválida: "${horaRaw}" (usa HH:MM)` };

  const local = equiposPorNombre[normalizarNombreEquipo(localRaw)];
  const visitante = equiposPorNombre[normalizarNombreEquipo(visitanteRaw)];
  if(!local) return { error: `No existe el equipo "${localRaw}"` };
  if(!visitante) return { error: `No existe el equipo "${visitanteRaw}"` };
  if(local.id === visitante.id) return { error: 'El local y el visitante son el mismo equipo' };

  const fecha = new Date(`${fechaRaw}T${horaRaw.padStart(5,'0')}:00`);
  if(isNaN(fecha.getTime())) return { error: 'No se pudo interpretar la fecha y hora' };

  return { jornada, fechaISO: fecha.toISOString(), fechaTexto: fechaRaw, hora: horaRaw,
           local, visitante };
}

let importacionLista = [];

async function abrirImportador(){
  openModal('<h3>Importar calendario</h3><div class="loader"></div>');
  const [eqSnap, paSnap] = await Promise.all([
    db.collection('equipos').get(),
    db.collection('partidos').get()
  ]);
  const yaHay = paSnap.size;
  openModal(`
    <h3>Importar calendario</h3>
    <p style="font-size:14px; color:var(--ink-soft); line-height:1.55; margin-bottom:14px;">
      Pega el fixture completo, una línea por partido, con los campos separados por
      <b>|</b> en este orden: jornada, fecha, hora, local, visitante.
    </p>
    <div class="mercado-nota" style="font-family:var(--mono); font-size:12px; margin-bottom:14px;">
      J1 | 2026-11-22 | 08:00 | Rosados FC | Blacks FC
    </div>
    ${yaHay ? `<div class="aviso-rechazo">Ya hay <b>${yaHay}</b> partido${yaHay===1?'':'s'} cargado${yaHay===1?'':'s'}.
      Importar no borra nada: se van a sumar a los que ya existen.</div>` : ''}
    <div class="field"><label>Fixture</label>
      <textarea id="impTexto" rows="9" style="font-family:var(--mono); font-size:12.5px;"
        placeholder="J1 | 2026-11-22 | 08:00 | Rosados FC | Blacks FC&#10;J1 | 2026-11-22 | 10:00 | ..."></textarea></div>
    <div class="field"><label>Cancha o sede (opcional, para todos)</label>
      <input id="impCancha" placeholder="Ej: Colegio Los Arcos"></div>
    <button class="btn btn-primary btn-block" onclick="previsualizarImportacion()">Revisar antes de cargar</button>
    <div id="impResultado" style="margin-top:16px;"></div>
  `);
  window.__equiposImport = {};
  eqSnap.docs.forEach(d => {
    window.__equiposImport[normalizarNombreEquipo(d.data().nombre)] = { id: d.id, nombre: d.data().nombre };
  });
}

function previsualizarImportacion(){
  const texto = document.getElementById('impTexto').value;
  const lineas = texto.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  const salida = document.getElementById('impResultado');

  if(lineas.length === 0){ salida.innerHTML = '<div class="auth-error">No hay nada que importar.</div>'; return; }

  const ok = [], errores = [];
  lineas.forEach((l, i) => {
    const r = parsearLineaPartido(l, window.__equiposImport);
    if(r.error) errores.push({ n: i+1, linea: l, error: r.error });
    else ok.push(r);
  });

  importacionLista = ok;
  ok.sort((a,b) => a.fechaISO.localeCompare(b.fechaISO));

  const porJornada = {};
  ok.forEach(p => { (porJornada[p.jornada] = porJornada[p.jornada] || []).push(p); });

  salida.innerHTML = `
    ${errores.length ? `<div class="aviso-rechazo">
      <b>${errores.length} línea${errores.length===1?'':'s'} con problemas.</b> No se van a importar:
      <ul style="margin:8px 0 0 18px; line-height:1.6;">
        ${errores.slice(0,8).map(e => `<li>Línea ${e.n}: ${escapeHtml(e.error)}</li>`).join('')}
        ${errores.length > 8 ? `<li>…y ${errores.length-8} más</li>` : ''}
      </ul></div>` : ''}

    ${ok.length ? `
      <div class="section-title">Se van a crear ${ok.length} partidos en ${Object.keys(porJornada).length} jornadas</div>
      <div style="max-height:260px; overflow-y:auto; border-radius:var(--r-sm); background:var(--bone); padding:12px 14px; font-size:13.5px;">
        ${Object.keys(porJornada).sort((a,b)=>a-b).map(j => `
          <div style="font-weight:600; margin:10px 0 4px;">Jornada ${j} · ${porJornada[j][0].fechaTexto}</div>
          ${porJornada[j].map(p => `<div style="color:var(--ink-soft); padding:2px 0;">
            ${p.hora} &nbsp; ${escapeHtml(p.local.nombre)} vs ${escapeHtml(p.visitante.nombre)}</div>`).join('')}
        `).join('')}
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:14px;" id="impConfirmar"
        onclick="confirmarImportacion()">Crear los ${ok.length} partidos</button>`
    : '<div class="auth-error">Ninguna línea es válida.</div>'}`;
}

async function confirmarImportacion(){
  if(!importacionLista.length) return;
  const btn = document.getElementById('impConfirmar');
  const cancha = document.getElementById('impCancha').value.trim();
  btn.disabled = true;

  let creados = 0, fallidos = 0;
  for(const p of importacionLista){
    btn.textContent = `Creando… ${creados + fallidos + 1} de ${importacionLista.length}`;
    try{
      await db.collection('partidos').add({
        equipoLocalId: p.local.id,
        equipoVisitanteId: p.visitante.id,
        fecha: p.fechaISO,
        jornada: p.jornada,
        cancha,
        estado: 'programado',
        golesLocal: null, golesVisitante: null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      creados++;
    }catch(e){ fallidos++; console.error(e); }
  }

  closeModal();
  toast(fallidos ? `${creados} partidos creados, ${fallidos} fallaron` : `${creados} partidos creados`,
        fallidos ? 'error' : 'success');
  renderPartidosAdmin();
}

/* =========================================================================
   BORRAR EL CALENDARIO COMPLETO
   Acción irreversible: además de los partidos se llevan sus actas y sus
   convocatorias, que sin partido quedarían como basura suelta. Por eso pide
   escribir la palabra, y no solo un clic de confirmación.
   ========================================================================= */
async function abrirBorrarCalendario(){
  openModal('<h3>Borrar calendario</h3><div class="loader"></div>');
  try{
    const [paSnap, coSnap] = await Promise.all([
      db.collection('partidos').get(),
      db.collection('convocatorias').get()
    ]);
    const partidos = paSnap.docs.map(d => ({id:d.id, ...d.data()}));
    if(partidos.length === 0){
      openModal('<h3>Borrar calendario</h3><div class="empty-state">No hay partidos cargados.</div>');
      return;
    }

    const oficiales = partidos.filter(p => p.estado === 'validado').length;
    const jugados = partidos.filter(p => p.estado === 'jugado').length;

    // Cuántas actas existen de verdad
    let actas = 0;
    for(const p of partidos){
      if(p.estado === 'jugado' || p.estado === 'validado') actas++;
    }
    const convocatorias = coSnap.docs.filter(d =>
      partidos.some(p => p.id === d.data().partidoId)).length;

    window.__borrarPartidos = partidos.map(p => p.id);

    openModal(`
      <h3>Borrar todo el calendario</h3>
      <div class="aviso-rechazo">
        Se van a eliminar de forma permanente:
        <ul style="margin:8px 0 0 18px; line-height:1.6;">
          <li><b>${partidos.length}</b> partido${partidos.length===1?'':'s'}</li>
          ${actas ? `<li><b>${actas}</b> acta${actas===1?'':'s'} con sus goles, tarjetas e incidencias</li>` : ''}
          ${convocatorias ? `<li><b>${convocatorias}</b> convocatoria${convocatorias===1?'':'s'} cargada${convocatorias===1?'':'s'} por los delegados</li>` : ''}
        </ul>
      </div>

      ${oficiales || jugados ? `<div class="auth-note">
        <b>Ojo:</b> hay ${oficiales} partido${oficiales===1?'':'s'} ya oficial${oficiales===1?'':'es'}
        ${jugados ? `y ${jugados} jugado${jugados===1?'':'s'} sin validar ` : ''}en el calendario.
        Al borrarlos se pierden sus resultados y la tabla de posiciones vuelve a cero.
      </div>` : `<div class="auth-note">
        Ningún partido tiene resultados cargados todavía, así que no se pierde ninguna estadística.
      </div>`}

      <div class="field" style="margin-top:16px;">
        <label>Para confirmar, escribe BORRAR</label>
        <input id="borrarConfirma" placeholder="BORRAR" autocapitalize="characters"
               oninput="document.getElementById('btnBorrarCal').disabled = this.value.trim().toUpperCase() !== 'BORRAR'">
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-danger" style="flex:1;" id="btnBorrarCal" disabled
                onclick="ejecutarBorradoCalendario()">Borrar todo</button>
      </div>
    `);
  }catch(e){
    openModal(`<h3>Borrar calendario</h3><div class="empty-state">Error: ${escapeHtml(e.message)}</div>`);
  }
}

async function ejecutarBorradoCalendario(){
  const ids = window.__borrarPartidos || [];
  if(!ids.length) return;
  const btn = document.getElementById('btnBorrarCal');
  btn.disabled = true;

  let borrados = 0, fallidos = 0;

  // Primero las convocatorias, que dependen de los partidos
  try{
    const coSnap = await db.collection('convocatorias').get();
    for(const d of coSnap.docs){
      if(ids.includes(d.data().partidoId)){
        await db.collection('convocatorias').doc(d.id).delete().catch(()=>{});
      }
    }
  }catch(e){ console.warn('convocatorias:', e); }

  for(const id of ids){
    btn.textContent = `Borrando… ${borrados + fallidos + 1} de ${ids.length}`;
    try{
      await db.collection('actas').doc(id).delete().catch(()=>{});
      await db.collection('partidos').doc(id).delete();
      borrados++;
    }catch(e){ fallidos++; console.error(e); }
  }

  window.__borrarPartidos = [];
  closeModal();
  toast(fallidos ? `${borrados} partidos borrados, ${fallidos} fallaron`
                 : `Calendario borrado (${borrados} partidos)`,
        fallidos ? 'error' : 'success');
  renderPartidosAdmin();
}

/* =========================================================================
   CALIFICACIÓN DE ÁRBITROS
   Al validar el acta, cada delegado le pone del 1 al 5 al árbitro del partido.
   Los datos viven en una colección aparte a la que los árbitros no tienen
   acceso por reglas de Firestore, no solo por la interfaz: es la única forma
   de que las notas sean francas.
   ========================================================================= */
const ETIQUETAS_PUNTUACION = {
  1: 'Muy deficiente',
  2: 'Deficiente',
  3: 'Aceptable',
  4: 'Bueno',
  5: 'Excelente'
};

let _puntuacionElegida = 0;

function estrellasHtml(valor, interactivo){
  return `<div class="estrellas${interactivo?' interactivo':''}">
    ${[1,2,3,4,5].map(n => `
      <span class="estrella${n <= valor ? ' llena' : ''}"
            ${interactivo ? `onclick="elegirPuntuacion(${n})" role="button" tabindex="0"
              onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();elegirPuntuacion(${n});}"` : ''}
            >★</span>`).join('')}
  </div>`;
}

function elegirPuntuacion(n){
  _puntuacionElegida = n;
  const cont = document.getElementById('califEstrellas');
  if(cont) cont.innerHTML = estrellasHtml(n, true);
  const etq = document.getElementById('califEtiqueta');
  if(etq) etq.textContent = ETIQUETAS_PUNTUACION[n] || '';
  const btn = document.getElementById('btnValidarConNota');
  if(btn) btn.disabled = false;
}

/* Modal que reemplaza al botón directo de validar. */
async function abrirValidacionConNota(partidoId, esLocal){
  _puntuacionElegida = 0;
  const cerradaYa = await db.collection('actas').doc(partidoId).get();
  if(actaEstaCerrada(cerradaYa.exists ? cerradaYa.data() : null)){
    toast('El acta ya está cerrada: ya no admite cambios', 'error');
    return;
  }
  const [pDoc, aDoc] = await Promise.all([
    db.collection('partidos').doc(partidoId).get(),
    db.collection('actas').doc(partidoId).get()
  ]);
  if(!aDoc.exists){ toast('Ese partido no tiene acta', 'error'); return; }
  const p = pDoc.data(), acta = aDoc.data();
  const [local, visitante] = await Promise.all([
    getEquipoNombre(p.equipoLocalId), getEquipoNombre(p.equipoVisitanteId)
  ]);

  openModal(`
    <h3>Validar el acta</h3>
    <div class="dato-linea"><span>Partido</span><span>${escapeHtml(local)} ${acta.golesLocal ?? 0} — ${acta.golesVisitante ?? 0} ${escapeHtml(visitante)}</span></div>
    <div class="dato-linea"><span>Árbitro</span><span>${escapeHtml(acta.arbitroNombre || '—')}</span></div>

    <hr class="section-divider">
    <div class="section-title">¿Cómo estuvo el arbitraje?</div>
    <div id="califEstrellas">${estrellasHtml(0, true)}</div>
    <div id="califEtiqueta" class="calif-etq"></div>

    <div class="field" style="margin-top:16px;">
      <label>Comentario (opcional)</label>
      <textarea id="califComentario" rows="2" maxlength="220"
        placeholder="Ej: Buen manejo del partido, cobró parejo."></textarea>
    </div>

    <div class="auth-note">
      La puntuación la ven los demás delegados y el administrador de la liga.
      <b>Los árbitros no tienen acceso</b>, para que puedas ser franco.
    </div>

    <button class="btn btn-primary btn-block" id="btnValidarConNota" disabled
            onclick="confirmarValidacionConNota('${partidoId}', ${esLocal})">
      Validar acta y guardar puntuación
    </button>
  `);
}

async function confirmarValidacionConNota(partidoId, esLocal){
  if(!_puntuacionElegida){ toast('Elige una puntuación del 1 al 5', 'error'); return; }
  const btn = document.getElementById('btnValidarConNota');
  btn.disabled = true;
  try{
    const aDoc = await db.collection('actas').doc(partidoId).get();
    const acta = aDoc.data();
    const equipoNombre = await getEquipoNombre(currentProfile.equipoId);

    // Un documento por partido y equipo: cada delegado califica una vez.
    await db.collection('calificaciones').doc(`${partidoId}_${currentProfile.equipoId}`).set({
      partidoId,
      equipoId: currentProfile.equipoId,
      equipoNombre,
      arbitroUid: acta.arbitroUid || null,
      arbitroNombre: acta.arbitroNombre || null,
      puntuacion: _puntuacionElegida,
      comentario: document.getElementById('califComentario').value.trim(),
      delegadoUid: currentUser.uid,
      delegadoNombre: currentProfile.nombre,
      fecha: new Date().toISOString()
    });

    closeModal();
    await validarActa(partidoId, esLocal);
  }catch(e){
    btn.disabled = false;
    toast('Error: ' + e.message, 'error');
  }
}

/* ---------- Vista compilada, solo para delegados y administración ---------- */
async function renderArbitros(){
  const c = document.getElementById('content');
  c.innerHTML = `<h2>Árbitros</h2>
    <p class="page-sub">Puntuaciones que los delegados dejan al validar cada acta. Los árbitros no ven esta pantalla.</p>
    <div id="arbArea"><div class="loader"></div></div>`;

  try{
    const [califSnap, usrSnap] = await Promise.all([
      db.collection('calificaciones').get(),
      db.collection('users').where('rol','==',ROLES.ARBITRO).get()
    ]);

    const califs = califSnap.docs.map(d => d.data());
    const arbitros = {};
    usrSnap.docs.forEach(d => {
      const u = d.data();
      arbitros[d.id] = { uid:d.id, nombre:u.nombre, notas:[], comentarios:[] };
    });
    califs.forEach(k => {
      const id = k.arbitroUid || ('n:' + (k.arbitroNombre || '—'));
      if(!arbitros[id]) arbitros[id] = { uid:id, nombre:k.arbitroNombre || '—', notas:[], comentarios:[] };
      arbitros[id].notas.push(k.puntuacion);
      if(k.comentario) arbitros[id].comentarios.push(k);
    });

    const lista = Object.values(arbitros).map(a => {
      const n = a.notas.length;
      const prom = n ? a.notas.reduce((s,x)=>s+x,0) / n : null;
      const dist = [1,2,3,4,5].map(v => a.notas.filter(x => x === v).length);
      return { ...a, n, prom, dist };
    }).sort((a,b) => (b.prom ?? -1) - (a.prom ?? -1));

    if(lista.length === 0){
      document.getElementById('arbArea').innerHTML =
        '<div class="empty-state">Todavía no hay árbitros registrados.</div>';
      return;
    }

    const totalNotas = califs.length;
    const promGeneral = totalNotas ? (califs.reduce((s,k)=>s+k.puntuacion,0)/totalNotas) : null;

    document.getElementById('arbArea').innerHTML = `
      ${totalNotas ? `<div class="card resumen-plantilla" style="padding:18px 22px;">
        <div class="resumen-cifras" style="border:none; padding:0; margin:0;">
          <div class="cifra"><div class="cifra-num">${promGeneral.toFixed(1)}</div><div class="cifra-lbl">promedio de la liga</div></div>
          <div class="cifra"><div class="cifra-num">${totalNotas}</div><div class="cifra-lbl">puntuacion${totalNotas===1?'':'es'}</div></div>
          <div class="cifra"><div class="cifra-num">${lista.filter(a=>a.n>0).length}</div><div class="cifra-lbl">árbitros con notas</div></div>
        </div>
      </div>` : ''}

      ${lista.map(a => `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:14px;">
            <div style="min-width:0;">
              <div style="font-weight:600; font-size:16px;">${escapeHtml(a.nombre)}</div>
              <div style="font-size:13px; color:var(--ink-faint); margin-top:2px;">
                ${a.n ? `${a.n} partido${a.n===1?'':'s'} calificado${a.n===1?'':'s'}` : 'Sin calificaciones todavía'}
              </div>
            </div>
            ${a.n ? `<div style="text-align:right; flex-shrink:0;">
              <div class="arb-prom">${a.prom.toFixed(1)}</div>
              ${estrellasHtml(Math.round(a.prom), false)}
            </div>` : ''}
          </div>

          ${a.n ? `
            <div style="margin-top:14px;">
              ${[5,4,3,2,1].map(v => {
                const cant = a.dist[v-1];
                return `<div class="resumen-fila">
                  <span class="resumen-etq" style="width:120px;">${v} · ${ETIQUETAS_PUNTUACION[v]}</span>
                  <span class="resumen-barra"><span style="width:${a.n?Math.round(cant/a.n*100):0}%; background:${v>=4?'#2E7B70':v===3?'var(--sand)':'var(--card-red)'};"></span></span>
                  <span class="resumen-n">${cant}</span>
                </div>`;
              }).join('')}
            </div>
            ${a.comentarios.length ? `
              <hr class="section-divider" style="margin:14px 0;">
              <div class="resumen-titulo">Comentarios</div>
              ${a.comentarios.slice(-4).reverse().map(k => `
                <div class="mercado-nota" style="margin-top:8px;">
                  “${escapeHtml(k.comentario)}”
                  <div class="firma-meta" style="margin-top:5px;">
                    ${escapeHtml(k.delegadoNombre || '')}${k.equipoNombre ? ' · ' + escapeHtml(k.equipoNombre) : ''}
                    ${k.fecha ? ' · ' + fechaCorta(k.fecha) : ''} · ${k.puntuacion}/5
                  </div>
                </div>`).join('')}` : ''}
          ` : ''}
        </div>`).join('')}`;
  }catch(e){
    document.getElementById('arbArea').innerHTML = `<div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

  try{

    const activos = snap.docs.filter(d => d.data().estado === EST.APROBADO).length;

    if(el) el.textContent = `Hay ${activos} delegado${activos===1?'':'s'} aprobado${activos===1?'':'s'} en la liga.`;
  }catch(e){ /* dato informativo, no bloquea */ }
}

// Compara la fecha elegida contra la vigente y dice a quién le cambia la categoría.
function previsualizarCorte(){
  const nueva = document.getElementById('cfgFecha').value;
  const salida = document.getElementById('cfgImpacto');
  if(!salida) return;
  if(!nueva){ salida.innerHTML = '<div class="auth-error">Elige una fecha.</div>'; return; }

  const d = new Date(nueva + 'T00:00:00');
  if(isNaN(d.getTime())){ salida.innerHTML = '<div class="auth-error">Fecha inválida.</div>'; return; }
  if(nueva === CONFIG.fechaCorteEdad){
    salida.innerHTML = `<div class="auth-note" style="margin-bottom:0;">Es la fecha que ya está vigente.</div>`;
    return;
  }

  const cambios = [];
  for(const j of (_jugadoresConfig || [])){
    if(!j.fechaNacimiento) continue;
    const antes = categoriaPorEdad(calcularEdad(j.fechaNacimiento, CONFIG.fechaCorteEdad));
    const despues = categoriaPorEdad(calcularEdad(j.fechaNacimiento, nueva));
    const idA = antes ? antes.id : null, idD = despues ? despues.id : null;
    if(idA !== idD) cambios.push({ j, antes, despues });
  }

  salida.innerHTML = cambios.length === 0
    ? `<div class="auth-note" style="margin-bottom:0;">
         Ningún jugador cambia de categoría con esta fecha.
       </div>`
    : `<div class="aviso-rechazo">
         <b>${cambios.length} jugador${cambios.length===1?'':'es'} cambia${cambios.length===1?'':'n'} de categoría.</b>
       </div>
       <div style="max-height:220px; overflow-y:auto; background:var(--bone); border-radius:var(--r-sm); padding:10px 14px;">
         ${cambios.map(c => `
           <div style="display:flex; align-items:center; gap:9px; padding:7px 0; font-size:14px;">
             <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(c.j.nombre || '')}</span>
             ${c.antes ? `<span class="cat-badge" style="background:${fondoCategoria(c.antes)}; width:22px; height:22px; font-size:11px;">${c.antes.letra}</span>` : '<span class="badge">—</span>'}
             <span style="color:var(--ink-faint);">→</span>
             ${c.despues ? `<span class="cat-badge" style="background:${fondoCategoria(c.despues)}; width:22px; height:22px; font-size:11px;">${c.despues.letra}</span>` : '<span class="badge">—</span>'}
           </div>`).join('')}
       </div>`;
}

/* =========================================================================
   VALIDACIÓN DE FICHAS POR LOS DELEGADOS
   Una ficha queda aprobada cuando la revisan CUATRO delegados distintos.
   Todo queda firmado: quién validó, de qué equipo y cuándo. Nadie aprueba
   solo y nadie queda anónimo.
   ========================================================================= */
function validacionesRequeridas(){ return CONFIG.validacionesRequeridas || 4; }

function yaValide(u){
  return (u.validaciones || []).some(v => v.uid === currentUser.uid);
}
function cuentaValidaciones(u){
  return (u.validaciones || []).length;
}

/* =========================================================================
   CIERRE DEL ACTA
   Un acta queda CERRADA cuando el árbitro la subió y los dos delegados del
   partido la validaron. Desde ahí no la modifica nadie, salvo la administración
   en una corrección excepcional que exige motivo y queda registrada a la vista
   de todos. Esto se hace cumplir en las reglas de Firestore; lo que hay acá es
   la interfaz que lo explica y evita que alguien pierda su trabajo intentando.
   ========================================================================= */
function actaEstaCerrada(acta){
  return !!acta && acta.validadoLocal === true && acta.validadoVisitante === true;
}

function mensajeDeEscritura(e){
  if(e && e.code === 'permission-denied'){
    return 'Firestore rechazó el cambio. Si el acta ya se cerró, solo la administración puede modificarla.';
  }
  return 'Error: ' + (e && e.message ? e.message : e);
}

let _correccionAdmin = false;   // ¿el formulario abierto es una corrección de un acta cerrada?

async function guardarCorreccionAdmin(partidoId){
  const motivo = (document.getElementById('corrMotivo').value || '').trim();
  if(motivo.length < 8){
    toast('Explica el motivo de la corrección (al menos unas palabras)', 'error');
    document.getElementById('corrMotivo').focus();
    return;
  }
  if(!confirm('Vas a modificar un acta OFICIAL. Cambia la tabla de posiciones y las estadísticas, y queda registrado con tu nombre. ¿Continuar?')) return;

  const btn = document.getElementById('btnCorreccion');
  if(btn) btn.disabled = true;
  try{
    const aDoc = await db.collection('actas').doc(partidoId).get();
    if(!aDoc.exists){ toast('El acta ya no existe', 'error'); return; }
    const antes = aDoc.data();

    const golesLocal = Number(document.getElementById('golesLocal').value) || 0;
    const golesVisitante = Number(document.getElementById('golesVisitante').value) || 0;

    const entrada = {
      por: currentProfile.nombre,
      uid: currentUser.uid,
      fecha: new Date().toISOString(),
      motivo,
      antes: { golesLocal: antes.golesLocal ?? 0, golesVisitante: antes.golesVisitante ?? 0,
               incidencias: antes.incidencias || [] },
      despues: { golesLocal, golesVisitante }
    };

    // No se toca arbitroUid/arbitroNombre (las calificaciones dependen de ellos)
    // ni las firmas de validación: el acta sigue oficial, pero con constancia.
    await db.collection('actas').doc(partidoId).update({
      incidencias: actaIncidenciasTemp,
      golesLocal, golesVisitante,
      modificaciones: firebase.firestore.FieldValue.arrayUnion(entrada),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('partidos').doc(partidoId).update({ golesLocal, golesVisitante });

    _correccionAdmin = false;
    toast('Corrección registrada', 'success');
    verActaDetalle(partidoId);
  }catch(e){
    if(btn) btn.disabled = false;
    toast(mensajeDeEscritura(e), 'error');
  }
}

function firmasHtml(validaciones, titulo){
  if(!validaciones || !validaciones.length){
    return `<div class="firma-vacia">Todavía no hay validaciones registradas.</div>`;
  }
  return `
    ${titulo ? `<div class="resumen-titulo">${titulo}</div>` : ''}
    <div class="firmas">
      ${validaciones.map(v => `
        <div class="firma">
          <span class="firma-check">✓</span>
          <div style="min-width:0;">
            <div class="firma-nombre">${escapeHtml(v.nombre || '—')}${v.admin ? ' <span class="badge">admin</span>' : ''}</div>
            <div class="firma-meta">${escapeHtml(v.equipoNombre || '')}${v.equipoNombre && v.fecha ? ' · ' : ''}${v.fecha ? fechaCorta(v.fecha) : ''}</div>
          </div>
        </div>`).join('')}
    </div>`;
}

function fechaCorta(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('es-VE', {day:'numeric', month:'short'}) + ', ' +
           d.toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit', hour12:false});
  }catch(e){ return ''; }
}

function progresoValidacion(n){
  const req = validacionesRequeridas();
  const pct = Math.min(100, n / req * 100);
  return `
    <div class="progreso-val">
      <div class="progreso-barra"><span style="width:${pct}%;"></span></div>
      <span class="progreso-txt">${n} de ${req}</span>
    </div>`;
}

async function validarFicha(uid){
  try{
    const uDoc = await db.collection('users').doc(uid).get();
    const u = uDoc.data();
    if(yaValide(u)){ toast('Ya habías validado esta ficha'); closeModal(); return; }

    const equipoNombre = currentProfile.equipoId ? await getEquipoNombre(currentProfile.equipoId) : null;
    const firma = {
      uid: currentUser.uid,
      nombre: currentProfile.nombre,
      equipoId: currentProfile.equipoId || null,
      equipoNombre,
      fecha: new Date().toISOString(),
      admin: currentProfile.rol === ROLES.LIGA_ADMIN
    };
    const validaciones = [...(u.validaciones || []), firma];
    const completa = validaciones.length >= validacionesRequeridas()
                     || currentProfile.rol === ROLES.LIGA_ADMIN;

    const cambios = { validaciones };
    if(completa) cambios.estado = EST.APROBADO;
    await db.collection('users').doc(uid).update(cambios);

    // Si su ficha todavía no tiene miniatura para las nóminas, se genera ahora
    // a partir de la selfie: el delegado que valida sí tiene acceso a ella.
    if(u.jugadorId){
      try{
        const yaHay = await db.collection('fotos').doc(u.jugadorId).get();
        if(!yaHay.exists){
          const docs = await db.collection('documentos').doc(uid).get();
          if(docs.exists && docs.data().selfie){
            await guardarMiniatura(u.jugadorId, uid, docs.data().selfie);
            invalidarFoto(u.jugadorId);
          }
        }
      }catch(e){ console.warn('miniatura:', e); }
    }

    closeModal();
    toast(completa
      ? `${escapeHtml(u.nombre)} quedó aprobado`
      : `Validación registrada · ${validaciones.length} de ${validacionesRequeridas()}`, 'success');

    if(currentView === 'fichas') renderFichasPorValidar();
    else if(currentView === 'usuarios') renderUsuarios();
  }catch(e){
    toast('Error: ' + e.message, 'error');
  }
}

/* ---------- Delegado: buscar jugadores disponibles ---------- */
async function mercadoBuscar(){
  const area = document.getElementById('mercadoArea');
  if(!currentProfile.equipoId){
    area.innerHTML = '<div class="empty-state">Solo los delegados de un equipo pueden buscar jugadores.</div>';
    return;
  }
  try{
    // La consulta EXCLUYE a quienes se ocultaron para este equipo. No es un
    // filtro cosmético: las reglas de Firestore rechazan la consulta si no
    // viene con esta restricción, así que un delegado no puede saltársela.
    const [jugSnap, eqSnap, dispSnap] = await Promise.all([
      db.collection('jugadores').get(),
      db.collection('equipos').get(),
      db.collection('disponibilidad').where('ocultoParaEquipoId','!=',currentProfile.equipoId).get()
    ]);
    const nombresEq = {};
    eqSnap.docs.forEach(d => nombresEq[d.id] = d.data().nombre);

    const ofrecidos = {};
    dispSnap.docs.forEach(d => { const x = d.data(); if(x.activo) ofrecidos[d.id] = x; });

    let jugadores = jugSnap.docs.map(d => ({id:d.id, ...d.data()}))
      .filter(j => ofrecidos[j.id] && j.uid !== currentUser.uid)
      .map(j => ({...j, notaDisponibilidad: ofrecidos[j.id].nota || ''}));

    const total = jugadores.length;
    if(mercadoFiltros.posicion) jugadores = jugadores.filter(j => j.posicion === mercadoFiltros.posicion);
    if(mercadoFiltros.categoria){
      jugadores = jugadores.filter(j => {
        const r = categoriaDeFicha(j);
        return r && r.categoria && r.categoria.id === mercadoFiltros.categoria;
      });
    }
    if(mercadoFiltros.soloOtrosEquipos) jugadores = jugadores.filter(j => j.equipoId !== currentProfile.equipoId);
    jugadores.sort(ordenarPlantilla);

    area.innerHTML = `

        <div class="field-row" style="margin-bottom:0;">
          <div class="field" style="margin-bottom:10px;"><label>Posición</label>
            <select onchange="mercadoFiltros.posicion=this.value; mercadoBuscar()">
              <option value="">Cualquiera</option>
              ${POSICIONES.map(p=>`<option ${mercadoFiltros.posicion===p?'selected':''}>${p}</option>`).join('')}
            </select></div>
          <div class="field" style="margin-bottom:10px;"><label>Categoría</label>
            <select onchange="mercadoFiltros.categoria=this.value; mercadoBuscar()">
              <option value="">Cualquiera</option>
              ${CATEGORIAS_EDAD.map(x=>`<option value="${x.id}" ${mercadoFiltros.categoria===x.id?'selected':''}>${x.letra} · ${x.label}</option>`).join('')}
            </select></div>
        </div>
        <label style="display:flex; align-items:center; gap:9px; font-size:14px; cursor:pointer; margin-top:4px;">
          <input type="checkbox" ${mercadoFiltros.soloOtrosEquipos?'checked':''}
                 onchange="mercadoFiltros.soloOtrosEquipos=this.checked; mercadoBuscar()"
                 style="width:auto; margin:0; accent-color:var(--burgundy);">
          Ocultar a los de mi propio equipo
        </label>
      </div>

      ${total === 0 ? `<div class="empty-state">
          Ningún jugador disponible para tu equipo en este momento.<br>
          <span style="font-size:13px;">Aparecen aquí solo quienes activaron su disponibilidad.</span>
        </div>`
      : jugadores.length === 0 ? '<div class="empty-state">Ningún jugador disponible coincide con esos filtros.</div>'
      : `<div class="section-title">${jugadores.length} de ${total} disponible${total===1?'':'s'}</div>
         ${jugadores.map(j => `
          <div class="card mercado-jugador">
            <div class="jugador-dorsal">${j.numero ?? '—'}</div>
            <div style="flex:1; min-width:0;">
              <div class="jugador-nombre">${escapeHtml(j.nombre)}</div>
              <div class="jugador-meta">${escapeHtml(j.posicion || 'Sin posición')}
                <span class="sep">·</span>${escapeHtml(nombresEq[j.equipoId] || 'Sin equipo')}</div>
              ${j.notaDisponibilidad ? `<div class="mercado-nota">“${escapeHtml(j.notaDisponibilidad)}”</div>` : ''}

/* ---------- Delegado: publicar vacantes ---------- */
async function mercadoVacantes(){
  const area = document.getElementById('mercadoArea');
  const esAdmin = currentProfile.rol === ROLES.LIGA_ADMIN;
  try{
    const snap = await db.collection('publicaciones').get();
    let pubs = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if(!esAdmin) pubs = pubs.filter(p => p.equipoId === currentProfile.equipoId);

    area.innerHTML = `
      ${esAdmin ? '' : '<button class="btn btn-primary" style="margin-bottom:16px;" onclick="abrirNuevaVacante()">+ Publicar vacante</button>'}

    area.innerHTML = `<div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;

      </div>
    </div>

      ${p.categorias && p.categorias.length ? `<div style="margin-bottom:10px; display:flex; gap:7px; flex-wrap:wrap; align-items:center;">

function avisoAlcanceVacante(){
  const el = document.getElementById('vacAlcanceAviso');
  if(!el) return;
  el.textContent = document.getElementById('vacAlcance').value === 'dirigida'
    ? 'Le aparece solo a los jugadores que cumplen la posición y la categoría que marcaste arriba. Hace falta marcar al menos una.'
    : 'Le aparece a todos los jugadores del torneo, salvo a los de tu propio equipo.';
}

async function guardarVacante(){
  const descripcion = document.getElementById('vacDescripcion').value.trim();
  if(!descripcion){ toast('Escribe un detalle de lo que buscas', 'error'); return; }

  const posiciones = [...document.querySelectorAll('.vac-pos:checked')].map(x=>x.value);
  const categorias = [...document.querySelectorAll('.vac-cat:checked')].map(x=>x.value);
  const alcance = document.getElementById('vacAlcance').value;

  // Una vacante dirigida sin ningún criterio sería idéntica a una abierta.
  if(alcance === 'dirigida' && posiciones.length === 0 && categorias.length === 0){
    toast('Para una vacante dirigida marca al menos una posición o una categoría', 'error');
    return;
  }

  try{
    const equipoNombre = await getEquipoNombre(currentProfile.equipoId);
    await db.collection('publicaciones').add({
      equipoId: currentProfile.equipoId, equipoNombre,
      delegadoUid: currentUser.uid, delegadoNombre: currentProfile.nombre,
      posiciones, categorias, alcance,
      descripcion, estado: 'abierta',
      creadaEl: new Date().toISOString(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeModal();
    toast('Vacante publicada', 'success');
    renderMercado();
  }catch(e){ toast('Error: ' + e.message, 'error'); }
}

async function cambiarEstadoVacante(id, estado){
  try{
    await db.collection('publicaciones').doc(id).update({ estado });
    toast(estado === 'cerrada' ? 'Vacante cerrada' : 'Vacante reabierta', 'success');
    renderMercado();
  }catch(e){ toast('Error: ' + e.message, 'error'); }
}

async function eliminarVacante(id){
  if(!confirm('¿Eliminar esta vacante?')) return;
  try{
    await db.collection('publicaciones').doc(id).delete();
    toast('Vacante eliminada');
    renderMercado();
  }catch(e){ toast('Error: ' + e.message, 'error'); }
}

/* ---------- Delegado: respuestas e invitaciones enviadas ---------- */
async function mercadoRespuestas(){
  const area = document.getElementById('mercadoArea');
  try{
    // Consulta restringida a su propio equipo: las reglas rechazan cualquier
    // lectura más amplia, así que no puede ver los movimientos de otros equipos
    // ni lo que hacen sus propios jugadores con terceros.
    const snap = await db.collection('contactos').where('equipoId','==',currentProfile.equipoId).get();
    const mios = snap.docs.map(d => ({id:d.id, ...d.data()}))
      .sort((a,b) => (b.creadoEl||'').localeCompare(a.creadoEl||''));

    const postulaciones = mios.filter(c => c.direccion === 'jugador_a_equipo');
    const invitaciones  = mios.filter(c => c.direccion === 'equipo_a_jugador');

    area.innerHTML = `
      <div class="section-title">Se postularon a tus vacantes (${postulaciones.length})</div>
      ${postulaciones.length === 0 ? '<div class="empty-state" style="padding:26px;">Nadie se ha postulado todavía.</div>'

function insigniaContacto(estado){

function tarjetaContacto(c, lado){
  const esInvitacion = c.direccion === 'equipo_a_jugador';
  const titulo = lado === 'delegado' ? c.jugadorNombre : c.equipoNombre;
  const puedeResponder = lado === 'jugador' && esInvitacion && c.estado === 'pendiente';
  return `<div class="card">

      </div>
      ${insigniaContacto(c.estado)}
    </div>

async function responderContacto(id, estado){
  try{
    await db.collection('contactos').doc(id).update({ estado, respondidoEl: new Date().toISOString() });

}

/* ---------- Jugador: oportunidades abiertas ---------- */
async function mercadoOportunidades(){
  const area = document.getElementById('mercadoArea');
  try{
    const [pubSnap, conSnap, jDoc] = await Promise.all([
      db.collection('publicaciones').get(),
      db.collection('contactos').where('jugadorUid','==',currentUser.uid).get(),
      currentProfile.jugadorId ? db.collection('jugadores').doc(currentProfile.jugadorId).get() : Promise.resolve({exists:false})
    ]);
    const yo = jDoc.exists ? jDoc.data() : {};
    const miCat = categoriaDeFicha(yo);
    const yaPostulado = new Set(conSnap.docs.map(d=>d.data())
      .filter(c => c.publicacionId)
      .map(c => c.publicacionId));

    // ¿Este jugador cumple lo que pide la vacante?
    const encaja = p =>
      (!p.posiciones || !p.posiciones.length || p.posiciones.includes(yo.posicion)) &&
      (!p.categorias || !p.categorias.length || (miCat && miCat.categoria && p.categorias.includes(miCat.categoria.id)));

    const pubs = pubSnap.docs.map(d => ({id:d.id, ...d.data()}))
      .filter(p => p.estado === 'abierta' && p.equipoId !== currentProfile.equipoId)
      // Una vacante dirigida solo le llega a quien cumple el perfil.
      .filter(p => p.alcance !== 'dirigida' || encaja(p));

    pubs.sort((a,b) => (encaja(b)?1:0) - (encaja(a)?1:0));

    area.innerHTML = pubs.length === 0
      ? '<div class="empty-state">No hay vacantes abiertas en este momento.</div>'
      : pubs.map(p => {
          const m = encaja(p);
          const postulado = yaPostulado.has(p.id);
          return `<div class="acta-card">
            <div class="acta-head">
              <div>
                <div class="jornada">${escapeHtml(p.equipoNombre || '')} · incorporación al equipo</div>
                <div class="matchup">${p.posiciones && p.posiciones.length ? escapeHtml(p.posiciones.join(', ')) : 'Cualquier posición'}</div>
              </div>
              ${m ? '<span class="acta-status status-validado">Encaja contigo</span>' : ''}
            </div>
            <div class="acta-body">
              ${p.categorias && p.categorias.length ? `<div style="margin-bottom:10px; display:flex; gap:7px; flex-wrap:wrap; align-items:center;">
                <span style="font-size:13px; color:var(--ink-faint);">Categorías:</span>
                ${p.categorias.map(id => { const c = CATEGORIAS_EDAD.find(x=>x.id===id);
                  return c ? `<span class="cat-badge" style="background:${fondoCategoria(c)};">${c.letra}</span>` : ''; }).join('')}
              </div>` : ''}
              <div style="font-size:14.5px; line-height:1.55;">${escapeHtml(p.descripcion || '')}</div>
              <div style="margin-top:14px;">
                ${postulado
                  ? '<span class="badge badge-aprobado">Ya te postulaste</span>'
                  : `<button class="btn btn-sm btn-primary" onclick="abrirPostulacion('${p.id}')">Me interesa</button>`}
              </div>
            </div>
          </div>`;
        }).join('');
  }catch(e){
    area.innerHTML = `<div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

    area.innerHTML = '<div class="empty-state">Tu cuenta no tiene una ficha de jugador asociada.</div>';

            </span>
          </span>
        </label>

          <textarea id="dispNota" rows="3" maxlength="160"
            placeholder="Ej: Juego de portero. Busco equipo para lo que queda del torneo.">${escapeHtml(d.nota || '')}</textarea></div>

        <hr class="section-divider">
        <div class="section-title">Privacidad</div>
        <label style="display:flex; align-items:flex-start; gap:12px; cursor:pointer;">
          <input type="checkbox" id="dispOculto" ${oculto?'checked':''}
                 style="width:auto; margin:3px 0 0; transform:scale(1.35); accent-color:var(--burgundy);">

            <span style="font-weight:600; font-size:15.5px;">No mostrárselo al delegado de ${escapeHtml(equipoNombre)}</span>

      </div>

        Las invitaciones que recibas y las vacantes a las que te postules

async function guardarDisponibilidad(){
  try{
    const oculto = document.getElementById('dispOculto').checked;
    await db.collection('disponibilidad').doc(currentProfile.jugadorId).set({
      uid: currentUser.uid,
      jugadorId: currentProfile.jugadorId,
      equipoId: currentProfile.equipoId || null,
      activo: document.getElementById('dispCheck').checked,
      nota: document.getElementById('dispNota').value.trim(),
      // El campo siempre existe (null cuando no oculta nada): una consulta con
      // "!=" descarta los documentos donde el campo falta.
      ocultoParaEquipoId: oculto ? (currentProfile.equipoId || null) : null,
      actualizadoEl: new Date().toISOString()
    });
    toast('Disponibilidad actualizada', 'success');
  }catch(e){ toast('Error: ' + e.message, 'error'); }
}

/* =========================================================================
   VIEW: ESTADÍSTICAS
   ========================================================================= */
async function renderEstadisticas(){
  const c = document.getElementById('content');
  c.innerHTML = `<h2>Estadísticas</h2><p class="page-sub">Calculadas a partir de actas oficiales (validadas por ambos equipos)</p><div id="statsArea"><div class="loader"></div></div>`;
  try{
    const [partidosSnap, equipos] = await Promise.all([
      db.collection('partidos').where('estado','==','validado').get(),
      cargarEquipos()
    ]);
    const equiposInfo = {};
    Object.values(equipos).forEach(e => equiposInfo[e.id] =
      { id:e.id, nombre:e.nombre, color:e.color, pj:0, pg:0, pe:0, pp:0, gf:0, gc:0, pts:0 });

    const goleadores = {};
    const tarjetas = {};

    for(const pDoc of partidosSnap.docs){
      const p = pDoc.data();
      const local = equiposInfo[p.equipoLocalId], vis = equiposInfo[p.equipoVisitanteId];
      if(!local || !vis) continue;
      const gl = p.golesLocal||0, gv = p.golesVisitante||0;
      local.pj++; vis.pj++;
      local.gf += gl; local.gc += gv;
      vis.gf += gv; vis.gc += gl;
      if(gl > gv){ local.pg++; local.pts+=3; vis.pp++; }
      else if(gl < gv){ vis.pg++; vis.pts+=3; local.pp++; }
      else { local.pe++; vis.pe++; local.pts++; vis.pts++; }

      const actaDoc = await db.collection('actas').doc(pDoc.id).get();
      if(actaDoc.exists){
        (actaDoc.data().incidencias||[]).forEach(inc => {
          const key = inc.jugadorId;
          // De qué equipo es: lo dice el lado en que el árbitro lo anotó.
          const eq = equipos[inc.equipoLado === 'local' ? p.equipoLocalId : p.equipoVisitanteId];
          if(inc.tipo === 'gol'){
            goleadores[key] = goleadores[key] || {nombre: inc.jugadorNombre, numero: inc.jugadorNumero, equipo: eq, goles:0};
            goleadores[key].goles++;
          }
          if(inc.tipo === 'amarilla' || inc.tipo === 'roja'){
            tarjetas[key] = tarjetas[key] || {nombre: inc.jugadorNombre, numero: inc.jugadorNumero, equipo: eq, amarillas:0, rojas:0};
            if(inc.tipo==='amarilla') tarjetas[key].amarillas++; else tarjetas[key].rojas++;
          }
        });
      }
    }

    const tabla = Object.values(equiposInfo).sort((a,b)=> b.pts-a.pts || (b.gf-b.gc)-(a.gf-a.gc) || b.gf-a.gf);
    // En móvil se ocultan las columnas de detalle: lo que no puede faltar nunca
    // es la posición, el equipo, los jugados, la diferencia y los puntos.
    const tablaHtml = `
      <div class="table-scroll"><table class="stats-table tabla-posiciones">
        <thead><tr>
          <th class="col-pos">#</th><th>Equipo</th><th>PJ</th>
          <th class="col-detalle">PG</th><th class="col-detalle">PE</th><th class="col-detalle">PP</th>
          <th class="col-detalle">GF</th><th class="col-detalle">GC</th>
          <th>DIF</th><th class="col-pts">Pts</th>
        </tr></thead>
        <tbody>${tabla.map((e,i)=>{
          const dif = e.gf - e.gc;
          return `<tr>
            <td class="col-pos">${i+1}</td>
            <td class="col-equipo">${equipoConPunto(e)}</td>
            <td>${e.pj}</td>
            <td class="col-detalle">${e.pg}</td><td class="col-detalle">${e.pe}</td><td class="col-detalle">${e.pp}</td>
            <td class="col-detalle">${e.gf}</td><td class="col-detalle">${e.gc}</td>
            <td>${dif > 0 ? '+' : ''}${dif}</td>
            <td class="col-pts">${e.pts}</td>
          </tr>`;}).join('')}</tbody>
      </table></div>`;

    const golHtml = Object.values(goleadores).sort((a,b)=>b.goles-a.goles).slice(0,10)
      .map(g=>`<tr>
        <td><span class="jugador-en-tabla">${puntoEquipo(g.equipo && g.equipo.color)}
          <span><b>#${g.numero??'-'}</b> ${escapeHtml(g.nombre)}
          <span class="equipo-mini">${escapeHtml(g.equipo ? g.equipo.nombre : '')}</span></span></span></td>
        <td style="text-align:right; font-weight:700; font-family:var(--display);">${g.goles}</td></tr>`).join('') || '<tr><td colspan="2">Sin goles registrados</td></tr>';

    const tarjHtml = Object.values(tarjetas).sort((a,b)=>(b.rojas*2+b.amarillas)-(a.rojas*2+a.amarillas)).slice(0,10)
      .map(t=>`<tr>
        <td><span class="jugador-en-tabla">${puntoEquipo(t.equipo && t.equipo.color)}
          <span><b>#${t.numero??'-'}</b> ${escapeHtml(t.nombre)}
          <span class="equipo-mini">${escapeHtml(t.equipo ? t.equipo.nombre : '')}</span></span></span></td>
        <td style="text-align:right;">${t.amarillas ? `<span class="pill-amarilla">${t.amarillas}</span>` : '–'}</td>
        <td style="text-align:right;">${t.rojas ? `<span class="pill-roja">${t.rojas}</span>` : '–'}</td></tr>`).join('') || '<tr><td colspan="3">Sin tarjetas registradas</td></tr>';

    document.getElementById('statsArea').innerHTML = `
      <div class="card"><div class="section-title">Tabla de posiciones</div>${tablaHtml}</div>
      <div class="card"><div class="section-title">Goleadores</div>
        <div class="table-scroll"><table class="stats-table"><thead><tr><th>Jugador</th><th style="text-align:right;">Goles</th></tr></thead><tbody>${golHtml}</tbody></table></div></div>
      <div class="card"><div class="section-title">Tarjetas</div>
        <div class="table-scroll"><table class="stats-table"><thead><tr><th>Jugador</th><th style="text-align:right;">Amarillas</th><th style="text-align:right;">Rojas</th></tr></thead><tbody>${tarjHtml}</tbody></table></div></div>
    `;
  }catch(e){
    document.getElementById('statsArea').innerHTML = `<div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

/* --- Gestión de una cuenta (solo administrador de liga) --- */

    const juega = juegaEnElTorneo(u);

    const [docsSnap, jugSnap] = await Promise.all([
      juega ? db.collection('documentos').doc(uid).get() : Promise.resolve({exists:false}),
      u.jugadorId ? db.collection('jugadores').doc(u.jugadorId).get() : Promise.resolve({exists:false})
    ]);
    const docs = docsSnap.exists ? docsSnap.data() : null;
    const j = jugSnap.exists ? jugSnap.data() : {};

      <div class="dato-linea"><span>Correo</span><span style="word-break:break-all;">${escapeHtml(u.email || '—')}</span></div>

      ${juega ? `
        <div class="dato-linea"><span>Cédula</span><span>${escapeHtml(j.cedula || '—')}</span></div>
        <div class="dato-linea"><span>Nacimiento</span><span>${escapeHtml(j.fechaNacimiento || '—')}</span></div>
        <div class="dato-linea"><span>Categoría</span><span>${badgeCategoriaHtml(j, true)}</span></div>
        <div class="dato-linea"><span>Relación</span><span>${escapeHtml(etiquetaRelacion(j))}</span></div>
        <div class="dato-linea"><span>Camiseta</span><span>${j.numero ?? '—'}</span></div>
        <div class="dato-linea"><span>Posición</span><span>${escapeHtml(j.posicion || '—')}</span></div>
        <div class="dato-linea"><span>Teléfono</span><span>${escapeHtml(j.telefono || '—')}</span></div>
        <div class="dato-linea"><span>Emergencia</span><span>${escapeHtml(textoEmergencia(j))}</span></div>
      ` : ''}

      ${juega ? `<hr class="section-divider">
        ${docs ? `
          <div class="doc-caption">Selfie</div>
          <img class="doc-preview" src="${docs.selfie}" alt="Selfie del jugador">
          <div class="doc-caption">Cédula</div>
          <img class="doc-preview" src="${docs.cedula}" alt="Cédula del jugador">
        ` : '<div class="empty-state" style="padding:18px;">Sin documentos cargados.</div>'}` : ''}

      ${pendiente ? `
        <hr class="section-divider">
        <div class="section-title">Aprobación</div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" style="flex:1;" onclick="aprobarJugador('${uid}','${u.jugadorId||''}')">Aprobar ingreso</button>
          <button class="btn btn-secondary" style="flex:1;" onclick="rechazarSolicitud('${uid}')">Devolver</button>

/* --- Restablecer contraseña: Firebase le envía el enlace por correo.
       El administrador nunca ve ni define la contraseña de nadie. --- */
async function enviarResetPassword(uid){
  try{
    const doc = await db.collection('users').doc(uid).get();
    const email = doc.exists ? doc.data().email : null;
    if(!email){ toast('Esa cuenta no tiene correo registrado', 'error'); return; }
    await auth.sendPasswordResetEmail(email);
    toast('Correo de restablecimiento enviado a ' + email, 'success');
  }catch(e){
    toast('No se pudo enviar: ' + e.message, 'error');
  }
}

/* --- Inhabilitar / reactivar: bloqueo reversible que conserva el historial --- */
async function cambiarEstadoCuenta(uid, estado){
  if(uid === currentUser.uid){ toast('No puedes inhabilitar tu propia cuenta', 'error'); return; }
  try{
    await db.collection('users').doc(uid).update({ estado });
    closeModal();
    toast(estado === EST.INHABILITADO ? 'Cuenta inhabilitada' : 'Cuenta reactivada', 'success');
    renderUsuarios();
  }catch(e){
    toast('Error: ' + e.message, 'error');
  }
}

/* --- Eliminación definitiva de los datos --- */

  if(!doc.exists){ toast('La cuenta ya no existe'); return; }
