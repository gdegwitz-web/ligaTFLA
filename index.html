<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Liga TFLA</title>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<meta name="theme-color" content="#241D25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Liga TFLA">
<meta name="description" content="Estadisticas, plantillas y actas del Torneo de Padres y Ex-Alumnos del Colegio Los Arcos.">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   SISTEMA VISUAL — Liga TFLA
   El escudo es patrimonio: clásico, serif, con historia. La interfaz que lo
   rodea es lo contrario a propósito — limpia, con aire y esquinas suaves —
   igual que los clubes que conservan su escudo de 1920 en una app de 2026.
   La paleta sale del escudo; la tipografía y las formas, no.
   ========================================================================= */
:root{
  /* Color — derivado del escudo */
  --crest-dark: #241D25;
  --crest-darker: #17121A;
  --burgundy: #932F37;
  --burgundy-deep: #7A242C;
  --burgundy-soft: #F7EDEE;
  --sand: #DDB182;
  --sand-pale: #F3E2CC;
  --bone: #F7F5F2;
  --bone-dim: #EAE5DF;
  --surface: #FFFFFF;
  --ink: #1F1A22;
  --ink-soft: #6E6673;
  --ink-faint: #A49CA9;
  --card-yellow: #EFC04A;
  --card-red: #C4382C;
  --white: #FFFFFF;

  /* Tipografía — grotesca contemporánea, sin versalitas de programa impreso */
  --display: 'Space Grotesk', 'Inter', sans-serif;
  --body: 'Inter', system-ui, sans-serif;
  --mono: 'Space Mono', ui-monospace, monospace;

  /* Forma */
  --r-xs: 8px;
  --r-sm: 12px;
  --r: 18px;
  --r-lg: 26px;
  --r-pill: 999px;

  /* Profundidad: sombras suaves en capas, no bordes duros */
  --sh-sm: 0 1px 2px rgba(31,26,34,0.04), 0 2px 8px rgba(31,26,34,0.04);
  --sh: 0 2px 4px rgba(31,26,34,0.03), 0 8px 24px rgba(31,26,34,0.06);
  --sh-lg: 0 8px 20px rgba(31,26,34,0.08), 0 24px 56px rgba(31,26,34,0.10);
  --sh-up: 0 -2px 16px rgba(31,26,34,0.07);

  --nav-h: 66px;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family: var(--body);
  background: var(--bone);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.006em;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:16px;}
a{color:inherit;}
::selection{background: var(--sand); color: var(--crest-dark);}

:focus-visible{outline:2px solid var(--burgundy); outline-offset:3px; border-radius:6px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}

/* ============ SHELL ============ */
#app{min-height:100vh; display:flex; flex-direction:column;}

.center-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:
    radial-gradient(1000px 500px at 15% -5%, rgba(221,177,130,0.22), transparent 55%),
    radial-gradient(800px 500px at 95% 105%, rgba(147,47,55,0.30), transparent 55%),
    linear-gradient(170deg, var(--crest-dark) 0%, var(--crest-darker) 100%);
}

/* ============ HEADER ============ */
.scoreboard{
  background: rgba(36,29,37,0.92);
  backdrop-filter: saturate(160%) blur(14px);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  color: var(--bone);
  padding: 11px 22px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  position: sticky; top:0; z-index:40;
  border-bottom: 1px solid rgba(221,177,130,0.22);
}
.scoreboard .brand{display:flex; align-items:center; gap:11px; min-width:0;}
.scoreboard .brand .crest{width:38px; height:38px; object-fit:contain; flex-shrink:0;}
.scoreboard .brand h1{
  font-family: var(--display); font-weight:700; font-size:17px; letter-spacing:-0.02em; line-height:1.15;
}
.scoreboard .brand .sub{
  font-family: var(--body); font-size:11.5px; color: var(--sand); letter-spacing:0; margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.scoreboard .user-chip{display:flex; align-items:center; gap:10px; font-size:13.5px; flex-shrink:0;}
.role-tag{
  font-family: var(--body); font-size:11px; font-weight:600; letter-spacing:0;
  padding:5px 11px; border-radius: var(--r-pill);
  background: rgba(221,177,130,0.16); color: var(--sand);
  border:1px solid rgba(221,177,130,0.30);
}
.logout-btn{
  color: var(--ink-faint); font-size:13px; padding:6px 10px; border-radius:var(--r-pill);
  transition: background .15s, color .15s;
}
.logout-btn:hover{background: rgba(255,255,255,0.08); color: var(--bone);}

/* ============ NAVEGACIÓN ============ */
.app-body{display:flex; flex:1; min-height:0;}
.side-nav{width:238px; padding:18px 14px; flex-shrink:0;}
.side-nav button{
  width:100%; text-align:left; padding:11px 14px; margin-bottom:3px;
  font-family: var(--body); font-size:14.5px; font-weight:500; color: var(--ink-soft);
  border-radius: var(--r-sm); display:flex; align-items:center; gap:12px;
  transition: background .14s, color .14s;
}
.side-nav button svg{width:19px; height:19px; flex-shrink:0; opacity:.75;}
.side-nav button:hover{background: rgba(31,26,34,0.045); color: var(--ink);}
.side-nav button.active{background: var(--surface); color: var(--burgundy); font-weight:600; box-shadow: var(--sh-sm);}
.side-nav button.active svg{opacity:1;}
.side-nav .dot{display:none;}

.content{flex:1; padding:28px 34px 40px; overflow-y:auto; min-width:0; max-width:1080px;}
.content h2{font-family: var(--display); font-weight:700; font-size:27px; letter-spacing:-0.03em; margin-bottom:5px;}
.content .page-sub{color: var(--ink-soft); font-size:14.5px; margin-bottom:26px; line-height:1.5;}

/* Barra inferior en móvil: el patrón que la gente ya conoce de cualquier app */
.mobile-nav{display:none;}
.nav-mas-sheet{display:none;}

@media (max-width: 860px){
  .side-nav{display:none;}
  .content{padding:20px 16px calc(var(--nav-h) + 26px); max-width:none;}
  .scoreboard{padding:10px 16px;}
  .scoreboard .brand h1{font-size:16px;}
  .scoreboard .brand .sub{display:none;}
  .scoreboard .user-chip span:not(.role-tag){display:none;}
  .role-tag{font-size:10.5px; padding:4px 10px;}
  .content h2{font-size:23px;}

  .mobile-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:45;
    background: rgba(255,255,255,0.94);
    backdrop-filter: saturate(180%) blur(18px);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    border-top:1px solid var(--bone-dim); box-shadow: var(--sh-up);
    padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
    height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  }
  .mobile-nav button{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-family: var(--body); font-size:10.5px; font-weight:500; color: var(--ink-faint);
    border-radius: var(--r-sm); padding:5px 2px; min-width:0; transition: color .14s;
  }
  .mobile-nav button svg{width:22px; height:22px;}
  .mobile-nav button span{
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .mobile-nav button.active{color: var(--burgundy); font-weight:600;}
  .mobile-nav button.active svg{stroke-width:2.2;}

  .nav-mas-sheet{
    display:block; position:fixed; inset:0; z-index:60;
    background: rgba(31,26,34,0.45); opacity:0; pointer-events:none; transition: opacity .2s;
  }
  .nav-mas-sheet.abierta{opacity:1; pointer-events:auto;}
  .nav-mas-panel{
    position:absolute; left:0; right:0; bottom:0;
    background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: 10px 14px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .24s cubic-bezier(.2,.8,.3,1);
  }
  .nav-mas-sheet.abierta .nav-mas-panel{transform: translateY(0);}
  .nav-mas-panel .agarre{width:38px; height:4px; border-radius:99px; background:var(--bone-dim); margin:6px auto 14px;}
  .nav-mas-panel button{
    width:100%; display:flex; align-items:center; gap:13px; padding:14px 12px;
    font-size:15.5px; font-weight:500; color:var(--ink); border-radius: var(--r-sm);
  }
  .nav-mas-panel button svg{width:20px; height:20px; opacity:.7;}
  .nav-mas-panel button.active{color: var(--burgundy); background: var(--burgundy-soft); font-weight:600;}
}

/* ============ TARJETAS ============ */
.card{
  background: var(--surface); border-radius: var(--r); box-shadow: var(--sh);
  padding: 22px; margin-bottom: 16px;
}
.acta-card{
  background: var(--surface); border-radius: var(--r); overflow:hidden;
  box-shadow: var(--sh); margin-bottom:16px;
}
.acta-card .acta-head{
  background: linear-gradient(135deg, var(--crest-dark) 0%, #332836 100%);
  color: var(--bone); padding:17px 20px;
  display:flex; justify-content:space-between; align-items:center; gap:14px;
}
.acta-head .jornada{font-family:var(--body); font-size:11.5px; color:var(--sand); letter-spacing:0;}
.acta-head .matchup{font-family:var(--display); font-weight:700; font-size:18px; letter-spacing:-0.02em; margin-top:3px;}
.acta-status{
  font-family:var(--body); font-size:11px; font-weight:600; letter-spacing:0;
  padding:5px 11px; border-radius:var(--r-pill); flex-shrink:0; text-align:center; white-space:nowrap;
}
.status-programado{background:rgba(255,255,255,0.12); color:var(--sand-pale);}
.status-jugado, .status-pendiente{background:var(--sand-pale); color:#8A5A18;}
.status-validado{background:var(--sand); color:var(--crest-darker);}
.status-disputa{background:#F6DAD6; color:var(--card-red);}

.acta-body{padding:18px 20px;}
.incident-row{
  display:flex; align-items:center; gap:12px; padding:11px 0;
  border-bottom:1px solid var(--bone-dim); font-size:14.5px;
}
.incident-row:last-child{border-bottom:none;}
.incident-icon{
  width:26px; height:26px; border-radius:var(--r-xs); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-family:var(--mono); font-weight:700; color:var(--white);
}
.icon-gol{background: var(--burgundy);}
.icon-amarilla{background: var(--card-yellow); color:var(--crest-dark);}
.icon-roja{background: var(--card-red);}
.icon-otro{background: var(--ink-soft);}

/* ============ FORMULARIOS ============ */
.field{margin-bottom:16px;}
.field label{
  display:block; font-size:13px; font-weight:600; color:var(--ink-soft);
  margin-bottom:7px; letter-spacing:0;
}
.field input, .field select, .field textarea{
  width:100%; padding:13px 15px; border:1.5px solid transparent; border-radius: var(--r-sm);
  background: var(--bone); color: var(--ink); transition: border-color .14s, background .14s;
}
.field input::placeholder, .field textarea::placeholder{color: var(--ink-faint);}
.field input:focus, .field select:focus, .field textarea:focus{
  background: var(--surface); border-color: var(--burgundy); outline:none;
}
.field-row{display:flex; gap:14px;}
.field-row .field{flex:1; min-width:0;}
@media (max-width:560px){ .field-row{flex-direction:column; gap:0;} }

.btn{
  padding:13px 22px; border-radius: var(--r-pill);
  font-family: var(--body); font-weight:600; font-size:14.5px; letter-spacing:-0.01em;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  transition: transform .1s, background .15s, box-shadow .15s;
}
.btn:active{transform: scale(0.975);}
.btn-primary{background: var(--burgundy); color:#fff; box-shadow: 0 2px 10px rgba(147,47,55,0.22);}
.btn-primary:hover{background: var(--burgundy-deep); box-shadow: 0 4px 16px rgba(147,47,55,0.28);}
.btn-secondary{background: var(--bone); color: var(--ink);}
.btn-secondary:hover{background: var(--bone-dim);}
.btn-danger{background: var(--card-red); color:#fff;}
.btn-yellow{background: var(--card-yellow); color: var(--crest-dark);}
.btn-sm{padding:9px 16px; font-size:13px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none;}

.link-btn{color:var(--burgundy); font-weight:600; font-size:14px; padding:4px 2px; border-radius:6px;}
.link-btn:hover{text-decoration:underline; text-underline-offset:3px;}

/* ============ AVISO DE VERSIÓN NUEVA ============ */
.aviso-version{
  position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:110;
  display:flex; align-items:center; gap:12px;
  width:max-content; max-width:calc(100vw - 24px);
  background:var(--burgundy); color:#fff; padding:9px 9px 9px 20px;
  border-radius:var(--r-pill); box-shadow:var(--sh-lg); font-size:14px; font-weight:500;
  animation: subir .25s cubic-bezier(.2,.8,.3,1);
}
.aviso-version span{min-width:0;}
.aviso-version button{font-family:var(--body); cursor:pointer; border:none; flex-shrink:0;}
.av-actualizar{
  background:#fff; color:var(--burgundy); font-weight:700; font-size:13.5px;
  padding:8px 16px; border-radius:var(--r-pill);
}
.av-actualizar:disabled{opacity:.7;}
.av-luego{background:transparent; color:rgba(255,255,255,.75); font-size:15px; width:30px; height:30px; border-radius:50%;}
@media (max-width:860px){ .aviso-version{bottom: calc(var(--nav-h) + 16px);} }

/* ============ AUTENTICACIÓN ============ */
.check-fila{
  display:flex; align-items:flex-start; gap:11px; margin:2px 0 18px; cursor:pointer;
  font-size:14px; color:var(--ink); line-height:1.35;
}
.check-fila input{width:auto; margin:2px 0 0; transform:scale(1.2); accent-color:var(--burgundy); flex-shrink:0;}
.check-fila small{display:block; font-size:12px; color:var(--ink-faint); margin-top:2px;}
.auth-box{
  background: var(--surface); width:100%; max-width:430px; border-radius: var(--r-lg);
  padding: 34px 30px 32px; box-shadow: var(--sh-lg);
}
.auth-box .crest-big{width:78px; height:78px; object-fit:contain; display:block; margin:0 auto 16px;}
.auth-box h1{font-family:var(--display); font-weight:700; font-size:25px; letter-spacing:-0.03em; text-align:center; margin-bottom:5px;}
.auth-box .tag{text-align:center; color:var(--ink-soft); font-size:13.5px; line-height:1.5; margin-bottom:26px;}
.auth-toggle{
  display:flex; margin-bottom:22px; border-radius: var(--r-pill);
  background: var(--bone); padding:4px; gap:4px;
}
.auth-toggle button{
  flex:1; padding:10px; border-radius: var(--r-pill);
  font-size:14px; font-weight:600; color:var(--ink-soft); transition: background .16s, color .16s;
}
.auth-toggle button.active{background: var(--surface); color:var(--burgundy); box-shadow: var(--sh-sm);}
.auth-error{
  background:#FCEDEB; color:#9E2B20; padding:12px 14px; border-radius: var(--r-sm);
  font-size:13.5px; margin-bottom:16px; line-height:1.45;
}
.auth-note{
  background: var(--bone); padding:13px 15px; border-radius: var(--r-sm);
  font-size:13px; color:var(--ink-soft); margin-bottom:16px; line-height:1.55;
}

/* ============ VARIOS ============ */
.empty-state{text-align:center; padding:52px 20px; color: var(--ink-faint); font-size:14.5px;}
.badge{
  display:inline-block; font-size:11px; font-weight:600; letter-spacing:0;
  padding:4px 10px; border-radius: var(--r-pill); background: var(--bone-dim); color: var(--ink-soft);
}
.badge-pendiente{background:var(--sand-pale); color:#8A5A18;}
.badge-aprobado{background:#E7F0EA; color:#2E6B45;}

.grid-cards{display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:14px;}
.team-tile{
  background: var(--surface); border-radius: var(--r); padding:20px;
  box-shadow: var(--sh-sm); cursor:pointer; transition: transform .14s, box-shadow .14s;
}
.team-tile:hover{transform: translateY(-2px); box-shadow: var(--sh);}
.team-tile .tname{font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:-0.02em; margin-bottom:4px;}
.team-tile .tmeta{font-size:13.5px; color:var(--ink-soft);}

table.stats-table{width:100%; border-collapse:collapse; font-size:14.5px;}
table.stats-table th{
  text-align:left; font-size:12.5px; font-weight:600; letter-spacing:0; color:var(--ink-faint);
  padding:10px 12px; border-bottom:1px solid var(--bone-dim);
}
table.stats-table td{padding:13px 12px; border-bottom:1px solid var(--bone-dim);}
table.stats-table tr:last-child td{border-bottom:none;}
table.stats-table tbody tr{transition: background .12s;}
table.stats-table tbody tr:hover td{background: var(--bone);}
.table-scroll{overflow-x:auto; margin:0 -4px; padding:0 4px;}

.section-title{
  font-family: var(--display); font-size:15px; font-weight:600; letter-spacing:-0.02em;
  color: var(--ink); margin-bottom:12px;
}

.loader{
  width:26px; height:26px; border:2.5px solid var(--bone-dim); border-top-color: var(--burgundy);
  border-radius:50%; animation: spin .7s linear infinite; margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background: var(--crest-dark); color:var(--bone);
  padding:13px 20px; border-radius: var(--r-pill); font-size:14px; font-weight:500;
  box-shadow: var(--sh-lg); z-index:100;
  width:max-content; max-width:calc(100vw - 32px);
  animation: subir .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes subir{from{opacity:0; transform:translate(-50%, 14px);} to{opacity:1; transform:translate(-50%,0);}}
.toast.toast-error{background: var(--card-red); color:#fff;}
.toast.toast-success{background: var(--crest-dark);}
@media (max-width:860px){ .toast{bottom: calc(var(--nav-h) + 18px);} }

.modal-overlay{
  position:fixed; inset:0; background: rgba(31,26,34,0.50);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:80; padding:20px;
  animation: aparecer .16s ease;
}
@keyframes aparecer{from{opacity:0;} to{opacity:1;}}
.modal-box{
  background: var(--surface); border-radius: var(--r-lg); padding:28px;
  max-width:540px; width:100%; max-height:86vh; overflow-y:auto; box-shadow: var(--sh-lg);
  animation: entrar .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes entrar{from{opacity:0; transform:translateY(12px) scale(.99);} to{opacity:1; transform:none;}}
.modal-box h3{font-family:var(--display); font-weight:700; font-size:20px; letter-spacing:-0.025em; margin-bottom:18px;}
.close-x{
  position:absolute; top:18px; right:20px; font-size:17px; color:var(--ink-faint);
  width:32px; height:32px; border-radius:50%; transition: background .14s;
}
.close-x:hover{background: var(--bone);}
@media (max-width:560px){
  .modal-overlay{align-items:flex-end; padding:0;}
  .modal-box{border-radius: var(--r-lg) var(--r-lg) 0 0; max-height:92vh; padding:24px 20px calc(24px + env(safe-area-inset-bottom));}
}

.section-divider{border:none; border-top:1px solid var(--bone-dim); margin:20px 0;}

/* ============ PANEL DE INICIO ============ */
.hero{
  position:relative; overflow:hidden; border-radius: var(--r-lg); padding:30px 28px 26px; margin-bottom:18px;
  background: linear-gradient(135deg, var(--crest-dark) 0%, #3A2C3D 60%, var(--burgundy-deep) 130%);
  color: var(--bone);
}
.hero-crest{
  position:absolute; right:-26px; top:50%; transform:translateY(-50%);
  width:172px; height:172px; object-fit:contain; opacity:.13; pointer-events:none;
}
.hero-saludo{font-size:14.5px; color:var(--sand); position:relative;}
.hero-nombre{
  font-family:var(--display); font-weight:700; font-size:30px; letter-spacing:-0.035em;
  margin:2px 0 6px; position:relative;
}
.hero-rol{font-size:13.5px; color:rgba(247,245,242,0.62); position:relative;}

.pendiente-card{
  display:flex; align-items:center; gap:16px; padding:18px 20px; margin-bottom:14px;
  background: var(--surface); border-radius: var(--r); box-shadow: var(--sh-sm);
  cursor:pointer; border-left:4px solid var(--burgundy); transition: transform .14s, box-shadow .14s;
}
.pendiente-card:hover{transform:translateY(-2px); box-shadow: var(--sh);}
.pendiente-num{
  font-family:var(--display); font-weight:700; font-size:32px; line-height:1;
  color:var(--burgundy); letter-spacing:-0.04em;
}
.pendiente-txt{font-size:15px; font-weight:600;}
.pendiente-cta{font-size:13px; color:var(--ink-faint); margin-top:2px;}

.proximo-card{
  padding:20px 22px; margin-bottom:14px; border-radius: var(--r);
  background: var(--surface); box-shadow: var(--sh-sm); cursor:pointer;
  transition: transform .14s, box-shadow .14s;
}
.proximo-card:hover{transform:translateY(-2px); box-shadow: var(--sh);}
.proximo-tag{font-size:12px; font-weight:600; color:var(--sand); letter-spacing:0;}
.proximo-vs{
  font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:-0.025em;
  margin:7px 0 6px; display:flex; align-items:center; gap:11px; flex-wrap:wrap;
}
.proximo-x{font-family:var(--body); font-weight:500; font-size:13px; color:var(--ink-faint);}
.proximo-meta{font-size:13.5px; color:var(--ink-soft);}

.accesos-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:12px;}
.acceso{
  display:flex; flex-direction:column; align-items:flex-start; gap:3px;
  padding:18px; border-radius: var(--r); background: var(--surface); box-shadow: var(--sh-sm);
  text-align:left; transition: transform .14s, box-shadow .14s;
}
.acceso:hover{transform:translateY(-2px); box-shadow: var(--sh);}
.acceso svg{width:22px; height:22px; color:var(--burgundy); margin-bottom:8px;}
.acceso-label{font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:-0.02em;}
.acceso-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.35;}

/* ============ ACCIONES DE CUENTA ============ */
.acciones-cuenta{display:flex; flex-direction:column; gap:8px;}
.btn-peligro{color: var(--card-red);}
.btn-peligro:hover{background:#FCEDEB;}

/* ============ AVATAR DEL JUGADOR ============ */
.foto-jug-fila{display:flex; align-items:center; gap:14px;}
.avatar-jug{
  border-radius:50%; object-fit:cover; flex-shrink:0; display:inline-flex;
  align-items:center; justify-content:center; background:var(--bone-dim);
  box-shadow: inset 0 0 0 1px rgba(31,26,34,0.12);
}
.avatar-jug.sin-foto{
  color:var(--ink-faint); font-family:var(--display); font-weight:600; letter-spacing:-0.02em;
}

/* ============ REGISTRO: CAMPOS OBLIGATORIOS Y CAMISETA ============ */
.req{color:var(--card-red); font-weight:700;}
.opc{color:var(--ink-faint); font-weight:400; font-size:12px;}
.cam-hint{font-size:12px; color:var(--ink-faint); margin-top:6px; line-height:1.45;}
.cam-ok{color:#2E7B70; font-weight:600;}
.cam-mal{color:var(--card-red); font-weight:600;}
.cam-ocup{margin-top:3px; color:var(--ink-soft);}

/* ============ ACTA CERRADA ============ */
.acta-cerrada{
  display:flex; align-items:center; gap:13px; padding:14px 16px; margin-bottom:16px;
  background:#EFF3F1; border-left:4px solid #2E7B70; border-radius:var(--r-sm);
  font-size:14px; line-height:1.5; color:#245B52;
}
.acta-cerrada-ico{font-size:22px; line-height:1; flex-shrink:0;}
.acta-cerrada .btn{flex-shrink:0;}

/* ============ ALINEACIÓN INICIAL ============ */
.alin-panel{position:sticky; top:0; z-index:2; background:var(--surface); padding-bottom:6px;}
.alin-cabecera{
  display:flex; align-items:center; gap:14px; padding:13px 15px;
  border-radius:var(--r-sm); background:var(--bone); border-left:4px solid var(--ink-faint);
}
.alin-cabecera.ok{background:#EAF3EE; border-left-color:#2E7B70;}
.alin-cabecera.no{background:#FCEDEB; border-left-color:var(--card-red);}
.alin-total{
  font-family:var(--display); font-weight:700; font-size:28px; line-height:1; letter-spacing:-0.04em;
}
.alin-total-lbl{font-size:11px; color:var(--ink-soft); margin-top:2px;}
.alin-veredicto{
  font-family:var(--display); font-weight:600; font-size:14px; flex-shrink:0;
}
.alin-cabecera.ok .alin-veredicto{color:#2E7B70;}
.alin-cabecera.no .alin-veredicto{color:var(--card-red);}

.alin-conteo{display:flex; gap:9px; flex-wrap:wrap;}
.alin-cat{display:flex; align-items:center; gap:5px;}
.alin-cat.vacia{opacity:.35;}
.alin-cat-n{font-family:var(--mono); font-weight:700; font-size:13px;}

.alin-reglas{margin-top:10px; display:flex; flex-direction:column; gap:5px;}
.alin-regla{display:flex; align-items:flex-start; gap:9px; font-size:13px; padding:3px 2px;}
.alin-marca{
  width:19px; height:19px; border-radius:50%; flex-shrink:0; font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.alin-regla.cumple .alin-marca{background:#E7F0EA; color:#2E6B45;}
.alin-regla.falla .alin-marca{background:#FBDFDB; color:var(--card-red);}
.alin-regla-tit{display:block; font-weight:500;}
.alin-regla-det{display:block; font-size:12px; color:var(--ink-faint); margin-top:1px;}
.alin-regla.falla .alin-regla-det{color:var(--card-red);}

.alin-equipos{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:760px){ .alin-equipos{grid-template-columns:1fr;} }
.alin-equipo{background:var(--bone); border-radius:var(--r-sm); padding:14px 16px;}
.alin-equipo-cab{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:15px;}
.alin-fila-mini{display:flex; align-items:center; font-size:13.5px; padding:5px 0;}

/* ============ PUNTUACIÓN DE ÁRBITROS ============ */
.estrellas{display:inline-flex; gap:4px;}
.estrella{
  font-size:19px; line-height:1; color:var(--bone-dim); user-select:none;
}
.estrellas.interactivo{gap:8px;}
.estrellas.interactivo .estrella{
  font-size:36px; cursor:pointer; transition: transform .1s, color .15s;
}
.estrellas.interactivo .estrella:hover{transform: scale(1.14); color:var(--card-yellow);}
.estrella.llena{color:var(--card-yellow);}
.calif-etq{
  font-family:var(--display); font-weight:600; font-size:15px;
  color:var(--burgundy); margin-top:8px; min-height:22px;
}
.arb-prom{
  font-family:var(--display); font-weight:700; font-size:30px; line-height:1;
  letter-spacing:-0.04em; color:var(--burgundy); margin-bottom:5px;
}

/* ============ FIRMAS Y PROGRESO DE VALIDACIÓN ============ */
.progreso-val{display:flex; align-items:center; gap:11px; margin-top:12px;}
.progreso-barra{
  flex:1; height:9px; background:var(--bone-dim); border-radius:99px; overflow:hidden;
}
.progreso-barra span{
  display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg, var(--burgundy), var(--sand)); transition:width .35s;
}
.progreso-txt{
  font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink-soft); flex-shrink:0;
}
.firmas{display:flex; flex-direction:column; gap:9px;}
.firma{display:flex; align-items:center; gap:11px; font-size:14px;}
.firma-check{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  background:#E7F0EA; color:#2E6B45; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700;
}
.firma-nombre{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.firma-meta{font-size:12.5px; color:var(--ink-faint); margin-top:1px;}
.firma-vacia{font-size:13.5px; color:var(--ink-faint);}

/* ============ RESUMEN DE PLANTILLA ============ */
.resumen-plantilla{padding:20px 22px;}
.resumen-cifras{
  display:flex; gap:10px; padding-bottom:18px; margin-bottom:18px;
  border-bottom:1px solid var(--bone-dim);
}
.cifra{flex:1; text-align:center;}
.cifra-num{
  font-family:var(--display); font-weight:700; font-size:30px;
  letter-spacing:-0.04em; color:var(--burgundy); line-height:1;
}
.cifra-lbl{font-size:12.5px; color:var(--ink-soft); margin-top:5px;}

.resumen-bloque{margin-bottom:20px;}
.resumen-titulo{
  font-family:var(--display); font-weight:600; font-size:14px;
  letter-spacing:-0.01em; color:var(--ink-soft); margin-bottom:10px;
}
.resumen-fila{display:flex; align-items:center; gap:10px; padding:5px 0; font-size:14px;}
.resumen-etq{width:44%; min-width:0; display:flex; align-items:center;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.resumen-barra{
  flex:1; height:8px; background:var(--bone-dim); border-radius:99px; overflow:hidden; min-width:24px;
}
.resumen-barra span{display:block; height:100%; border-radius:99px; transition:width .3s;}
.resumen-n{
  width:26px; text-align:right; font-family:var(--mono); font-size:13px; font-weight:700;
}
.resumen-aviso{
  font-size:12.5px; color:var(--ink-faint); margin-top:8px; line-height:1.45;
}
.resumen-chips{display:flex; gap:7px; flex-wrap:wrap;}
@media (max-width:480px){
  .resumen-etq{width:40%; font-size:13px;}
  .cifra-num{font-size:26px;}
}

/* ============ PUNTO DE COLOR DEL EQUIPO ============ */
.punto-equipo{
  display:inline-block; width:11px; height:11px; border-radius:50%;
  flex-shrink:0; vertical-align:baseline;
  box-shadow: inset 0 0 0 1px rgba(31,26,34,0.22), 0 1px 1px rgba(31,26,34,0.10);
}
.equipo-chip{
  display:inline-flex; align-items:center; gap:7px; min-width:0; max-width:100%;
}
.equipo-chip.invertido{flex-direction:row-reverse;}
.equipo-nombre{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ============ SELECTOR DE COLOR DE EQUIPO ============ */
.color-fila{display:flex; align-items:center; gap:14px;}
.color-fila input[type=color]{
  width:56px; height:44px; padding:3px; border-radius:var(--r-sm);
  border:1.5px solid var(--bone-dim); background:var(--bone); cursor:pointer; flex-shrink:0;
}
.color-previa{
  flex:1; display:flex; align-items:center; gap:9px; padding:12px 14px;
  background:var(--bone); border-radius:var(--r-sm); font-size:15px; min-width:0;
}
.color-sugerencias{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px;}
.color-chip{
  width:28px; height:28px; border-radius:50%; cursor:pointer;
  box-shadow: inset 0 0 0 1px rgba(31,26,34,0.22); transition: transform .12s;
}
.color-chip:hover{transform: scale(1.12);}

/* ============ JUGADOR EN TABLAS DE ESTADÍSTICAS ============ */
.jugador-en-tabla{display:flex; align-items:center; gap:9px; min-width:0;}
.equipo-mini{
  display:block; font-size:12px; color:var(--ink-faint); margin-top:1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.pill-amarilla, .pill-roja{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:24px; padding:2px 7px; border-radius:var(--r-xs);
  font-family:var(--mono); font-weight:700; font-size:12px;
}
.pill-amarilla{background:var(--card-yellow); color:var(--crest-dark);}
.pill-roja{background:var(--card-red); color:#fff;}
.team-tile .tname{display:flex; align-items:center; gap:8px;}

/* ============ CALENDARIO AGRUPADO POR FECHA ============ */
.fecha-grupo{
  background: var(--surface); border-radius: var(--r); box-shadow: var(--sh-sm);
  margin-bottom: 14px; overflow: hidden;
}
.fecha-grupo.es-hoy{box-shadow: var(--sh), 0 0 0 2px var(--burgundy);}
.fecha-cab{
  padding: 15px 18px 13px;
  border-bottom: 1px solid var(--bone-dim);
  background: linear-gradient(180deg, rgba(221,177,130,0.10), transparent);
}
.fecha-dia{
  font-family: var(--display); font-weight:600; font-size:16.5px; letter-spacing:-0.02em;
}
.fecha-anio{color: var(--ink-faint); font-weight:500;}
.fecha-meta{
  font-size:13px; color: var(--ink-soft); margin-top:3px;
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
}
.fecha-meta .sep{color: var(--ink-faint);}

.fecha-partidos{padding: 4px 8px 8px;}
.partido-fila{
  display:flex; align-items:center; gap:8px;
  padding: 11px 10px; border-radius: var(--r-sm);
  border-bottom: 1px solid var(--bone-dim);
}
.partido-fila:last-child{border-bottom:none;}
.partido-fila.abrible{cursor:pointer; transition: background .13s;}
.partido-fila.abrible:hover{background: var(--bone);}

.pf-hora{
  font-family: var(--mono); font-size:12px; color: var(--ink-faint);
  width:44px; flex-shrink:0;
}
.pf-equipo{
  flex:1; min-width:0; font-size:14.5px; font-weight:500;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.pf-local{text-align:right;}
.pf-marcador{
  flex-shrink:0; min-width:56px; text-align:center;
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.pf-goles{font-family: var(--display); font-weight:700; font-size:17px; letter-spacing:-0.02em;}
.pf-guion{color: var(--ink-faint); font-size:13px;}
.pf-vs{font-size:12.5px; color: var(--ink-faint);}

.pf-chip{
  flex-shrink:0; font-size:10.5px; font-weight:600; padding:3px 9px;
  border-radius: var(--r-pill); white-space:nowrap;
}
.pf-chip.oficial{background: var(--sand); color: var(--crest-darker);}
.pf-chip.pendiente{background: var(--sand-pale); color:#8A5A18;}
.pf-chip.disputa{background:#F6DAD6; color: var(--card-red);}
.pf-chip.hoy{background: var(--burgundy); color:#fff;}

.pf-acciones{display:flex; gap:2px; flex-shrink:0;}
.pf-acciones .icon-btn{width:30px; height:30px;}
.pf-acciones .icon-btn svg{width:15px; height:15px;}

@media (max-width: 560px){
  .pf-hora{width:40px; font-size:11px;}
  .pf-equipo{font-size:13.5px;}
  .pf-marcador{min-width:48px;}
  .pf-chip{display:none;}
  .partido-fila{gap:6px; padding:11px 6px;}
}

/* ============ MERCADO ============ */
.tabs{
  display:flex; gap:6px; margin-bottom:20px; background:var(--bone-dim);
  padding:4px; border-radius:var(--r-pill);
  overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{
  flex:1 1 auto; white-space:nowrap; padding:10px 16px; border-radius:var(--r-pill);
  font-size:13.5px; font-weight:600; color:var(--ink-soft);
  transition: background .16s, color .16s; scroll-snap-align:center;
}
@media (max-width:560px){
  /* Sin encogerlas: que se desplacen antes que quedar cortadas a medias */
  .tabs button{flex:0 0 auto; padding:10px 14px; font-size:13px;}
}
.tabs button.active{background:var(--surface); color:var(--burgundy); box-shadow:var(--sh-sm);}

.mercado-jugador{display:flex; align-items:center; gap:13px; padding:16px; margin-bottom:10px;}
.mercado-nota{
  font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin-top:6px;
  padding:10px 13px; background:var(--bone); border-radius:var(--r-sm);
}

/* ============ TABLA DE POSICIONES ============ */
.tabla-posiciones th, .tabla-posiciones td{text-align:center; padding:12px 6px; white-space:nowrap;}
.tabla-posiciones .col-equipo{text-align:left; font-weight:600; white-space:normal; min-width:96px;}
.tabla-posiciones .col-pos{
  color:var(--ink-faint); font-family:var(--mono); font-size:12px; width:26px;
}
.tabla-posiciones .col-pts{font-weight:700; color:var(--burgundy); font-size:15.5px;}
.tabla-posiciones thead th{font-size:11.5px;}
@media (max-width:620px){
  .tabla-posiciones .col-detalle{display:none;}
  .tabla-posiciones th, .tabla-posiciones td{padding:12px 4px; font-size:13.5px;}
}

/* ============ FILA DE JUGADOR ============ */
.jugador-fila{
  display:flex; align-items:center; gap:13px; padding:13px 8px;
  border-bottom:1px solid var(--bone-dim);
}
.jugador-fila:last-child{border-bottom:none;}
.jugador-dorsal{
  width:34px; height:34px; flex-shrink:0; border-radius:var(--r-xs);
  background: var(--bone); color: var(--ink-soft);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-weight:700; font-size:13px;
}
.jugador-info{flex:1; min-width:0;}
.jugador-nombre{
  font-weight:600; font-size:15px; letter-spacing:-0.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.jugador-meta{
  font-size:12.5px; color:var(--ink-soft); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.jugador-meta .sep{margin:0 6px; color:var(--ink-faint);}
.jugador-acciones{display:flex; gap:4px; flex-shrink:0;}
.icon-btn{
  width:34px; height:34px; border-radius:50%; color:var(--ink-faint);
  display:flex; align-items:center; justify-content:center; transition: background .14s, color .14s;
}
.icon-btn svg{width:17px; height:17px;}
.icon-btn:hover{background:var(--bone); color:var(--ink);}
.icon-btn.peligro:hover{background:#FCEDEB; color:var(--card-red);}

/* ============ CATEGORÍAS ============ */
.cat-badge{
  display:inline-flex; align-items:center; justify-content:center;
  width:26px; height:26px; border-radius:50%; flex-shrink:0;
  font-family:var(--display); font-weight:700; font-size:12.5px; color:#fff; line-height:1;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 1px 3px rgba(31,26,34,0.16);
}
.cat-rango{font-size:14px; color:var(--ink-soft); margin-left:10px;}
.cat-leyenda{
  display:flex; flex-wrap:wrap; gap:9px 20px; padding:14px 18px; margin-bottom:18px;
  background: var(--surface); border-radius: var(--r); box-shadow: var(--sh-sm);
}
.cat-leyenda-item{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft);}

/* ============ CONVOCATORIA ============ */
.conv-fila{
  display:flex; align-items:center; gap:4px; padding:12px 8px; border-radius: var(--r-sm);
  cursor:pointer; font-size:14.5px; transition: background .12s;
}
.conv-fila:hover{background: var(--bone);}
.conv-fila input[type=checkbox]{width:auto; margin:0 10px 0 0; flex-shrink:0; transform:scale(1.25); accent-color: var(--burgundy);}

/* ============ FOTOS ============ */
.foto-acciones{display:flex; gap:8px; margin-top:9px;}
.foto-acciones .btn{flex:1; padding:9px 4px; font-size:12.5px;}

.foto-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:560px){ .foto-grid{grid-template-columns:1fr;} }

.foto-slot{
  border:2px dashed var(--bone-dim); border-radius: var(--r); background: var(--bone);
  text-align:center; cursor:pointer; transition: border-color .15s, background .15s;
  overflow:hidden; position:relative; min-height:168px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 14px;
}
.foto-slot:hover{border-color: var(--burgundy); background: var(--surface);}
.foto-slot.cargada{border-style:solid; border-color:transparent; padding:0; background: var(--crest-dark);}
.foto-slot img{width:100%; height:100%; max-height:230px; object-fit:cover; display:block;}
.foto-slot .foto-icon{font-size:30px; line-height:1; margin-bottom:10px;}
.foto-slot .foto-label{font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:-0.01em;}
.foto-slot .foto-hint{font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.4;}
.foto-cambiar{
  position:absolute; bottom:0; left:0; right:0; background:rgba(36,29,37,0.86); color:var(--sand);
  font-size:12px; font-weight:500; padding:9px;
}
.foto-procesando{position:absolute; inset:0; background:rgba(255,255,255,0.92); display:flex; align-items:center; justify-content:center;}

.doc-preview{width:100%; border-radius: var(--r-sm); display:block; margin-bottom:10px; box-shadow: var(--sh-sm);}
.doc-caption{font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}

.dato-linea{
  display:flex; justify-content:space-between; align-items:center; gap:16px;
  padding:12px 0; border-bottom:1px solid var(--bone-dim); font-size:14.5px;
}
.dato-linea:last-child{border-bottom:none;}
.dato-linea span:first-child{font-size:13px; font-weight:500; color:var(--ink-faint); flex-shrink:0;}
.dato-linea span:last-child{text-align:right; font-weight:500; display:flex; align-items:center; justify-content:flex-end;}

.aviso-rechazo{
  background:#FCEDEB; padding:14px 16px; border-radius: var(--r-sm);
  font-size:13.5px; line-height:1.55; margin-bottom:18px; color:#7E2018;
}

/* ============ ONBOARDING ============ */
.onboarding-shell{
  min-height:100vh; padding:26px 16px 48px;
  background:
    radial-gradient(900px 420px at 15% -5%, rgba(221,177,130,0.20), transparent 55%),
    linear-gradient(170deg, var(--crest-dark) 0%, var(--crest-darker) 100%);
}
.onboarding-box{
  background: var(--surface); width:100%; max-width:600px; margin:0 auto;
  border-radius: var(--r-lg); padding:30px 26px 32px; box-shadow: var(--sh-lg);
}
.onboarding-box .crest-big{width:66px; height:66px; object-fit:contain; display:block; margin:0 auto 14px;}
.paso-titulo{
  font-family: var(--display); font-size:15px; font-weight:600; letter-spacing:-0.02em;
  color: var(--burgundy); margin:26px 0 12px;
}
</style>

function initFirebase(){
  if(firebaseConfig.apiKey === "TODO_API_KEY"){
    renderConfigPending();
    return;
  }
  try{
    app = firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    auth.languageCode = 'es';   // el correo de recuperar contraseña sale en español
    db = firebase.firestore();
    try{
      storage = firebase.storage();
    }catch(storageErr){
      // Storage requiere el plan Blaze — no es necesario todavía, así que lo salteamos sin romper el resto de la app.
      console.warn('Storage no disponible (plan Blaze no activado). Se puede activar más adelante.', storageErr);
      storage = null;
    }
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    firebaseReady = true;
    auth.onAuthStateChanged(handleAuthChange);
  }catch(e){
    console.error(e);
    renderConfigPending();
  }
}

// Cuánto se espera el perfil antes de avisar que no se puede cargar.
const ESPERA_PERFIL_MS = 12000;
let _timerPerfil = null;

async function handleAuthChange(user){
  unsubscribers.forEach(u => u());
  unsubscribers = [];
  clearTimeout(_timerPerfil);

  if(!user){
    currentUser = null;
    currentProfile = null;
    renderAuthScreen();
    return;
  }
  currentUser = user;

  // Si el perfil no llega (sin señal, o Firestore lo rechaza) NO se cierra la
  // sesión: se avisa y se deja reintentar. Antes la app deslogueaba sola.
  _timerPerfil = setTimeout(() => {
    if(!currentProfile || currentProfile.id !== user.uid) renderSinConexionScreen();
  }, ESPERA_PERFIL_MS);

  // Listen live to the user's profile doc (role, team, estado)
  const unsub = db.collection('users').doc(user.uid).onSnapshot(doc => {
    if(!doc.exists){
      // Sin conexión y sin el perfil en la memoria del teléfono, Firestore
      // responde "no existe" desde la caché. Eso solo significa "no lo tengo
      // aquí", no "lo borraron": cerrar la sesión en ese caso hacía que la
      // gente tuviera que ingresar de nuevo cada vez que abría con poca señal.
      if(doc.metadata && doc.metadata.fromCache) return;
      // El servidor confirmó que el perfil no existe: ahí sí se cierra.
      clearTimeout(_timerPerfil);
      auth.signOut();
      return;
    }
    clearTimeout(_timerPerfil);
    currentProfile = { id: doc.id, ...doc.data() };
    // La configuración define las categorías por edad, así que tiene que estar
    // cargada antes de dibujar cualquier pantalla.
    cargarConfig().then(enrutarPorEstado);
  }, err => {
    console.error('Error cargando perfil', err);
  });
  unsubscribers.push(unsub);
}

}

function actualizarNotaRegistro(){
  const nota = document.getElementById('regNota');
  if(!nota) return;
  const role = document.getElementById('regRole').value;
  const juega = document.getElementById('regJuega');
  const llenaFicha = role === 'jugador' || (role === 'delegado' && juega && juega.checked);
  nota.innerHTML = llenaFicha
    ? 'Después de crear tu acceso vas a completar tu ficha con tus datos, una <b>selfie</b> y una <b>foto de tu cédula</b>. El administrador de la liga revisa esa ficha y aprueba tu ingreso al equipo.'
    : 'Tu cuenta quedará <b>pendiente de aprobación</b> hasta que el administrador de la liga la valide.';

async function loadTeamsIntoSelect(selectId){
  try{
    const snap = await db.collection('equipos').orderBy('nombre').get();
    const sel = document.getElementById(selectId);
    if(!sel) return;
    if(snap.empty){
      sel.innerHTML = `<option value="">No hay equipos cargados aún</option>`;
      return;
    }
    sel.innerHTML = snap.docs.map(d => `<option value="${d.id}">${escapeHtml(d.data().nombre)}</option>`).join('');
  }catch(e){
    console.error(e);
  }
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const recordar = document.getElementById('loginRecordar').checked;
  const btn = document.getElementById('btnLogin');
  showAuthError('');
  if(!email || !pass){ showAuthError('Completa correo y contraseña.'); return; }

  if(btn){ btn.disabled = true; btn.textContent = 'Ingresando…'; }
  try{
    // Recordar = la sesión sobrevive a cerrar la app. No recordar = termina al
    // cerrarla. Se fija justo antes de ingresar; a propósito NO se fija al
    // arrancar, porque setPersistence también migra la sesión ya guardada y
    // convertiría en permanente la de quien había pedido que no se recordara.
    const P = firebase.auth.Auth.Persistence;
    try{ await auth.setPersistence(recordar ? P.LOCAL : P.SESSION); }
    catch(e){ console.warn('No se pudo fijar la persistencia:', e); }

    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = 'Ingresar'; }
    const olvido = e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found';
    document.getElementById('authError').innerHTML = `<div class="auth-error">${escapeHtml(translateAuthError(e))}${
      olvido ? ` <button type="button" class="link-btn" style="color:inherit; font-weight:700;" onclick="showAuthTab('recuperar')">Recuperar contraseña</button>` : ''}</div>`;
  }
}

/* ---------- Recuperar contraseña ---------- */
async function enviarRecuperacion(){
  const email = document.getElementById('recEmail').value.trim().toLowerCase();
  const salida = document.getElementById('recResultado');
  const btn = document.getElementById('btnRecuperar');

  if(!email){ salida.innerHTML = '<div class="auth-error">Escribe tu correo.</div>'; return; }
  if(!/^\S+@\S+\.\S+$/.test(email)){ salida.innerHTML = '<div class="auth-error">Ese correo no parece válido.</div>'; return; }

  btn.disabled = true; btn.textContent = 'Enviando…';
  salida.innerHTML = '';
  try{
    await auth.sendPasswordResetEmail(email);
    // Respuesta idéntica exista o no la cuenta: no se le dice a un extraño
    // qué correos están registrados en la liga.
    salida.innerHTML = `<div class="auth-note" style="border-left:3px solid #2E7B70;">
      Si ese correo tiene una cuenta, en unos minutos te llega un enlace para crear una contraseña nueva.
      Revisa también la carpeta de <b>spam</b> o correo no deseado.
    </div>`;
    // Enfriamiento de 60 s para que nadie dispare el envío diez veces seguidas.
    let s = 60;
    btn.textContent = `Reenviar en ${s} s`;
    const t = setInterval(() => {
      if(!document.body.contains(btn)){ clearInterval(t); return; }
      s--;
      if(s <= 0){ clearInterval(t); btn.disabled = false; btn.textContent = 'Enviar de nuevo'; }
      else btn.textContent = `Reenviar en ${s} s`;
    }, 1000);
  }catch(e){
    btn.disabled = false; btn.textContent = 'Enviar enlace';
    salida.innerHTML = `<div class="auth-error">${escapeHtml(translateAuthError(e))}</div>`;
  }
}

async function doRegister(){
  const nombre = formatearNombre(document.getElementById('regName').value);
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const pass = document.getElementById('regPass').value;
  const rol = document.getElementById('regRole').value;
  const equipoId = rol === 'arbitro' ? null : (document.getElementById('regTeam').value || null);
  // Un delegado que además juega necesita ficha igual que cualquier jugador.
  const esJugador = rol === ROLES.JUGADOR
    || (rol === ROLES.DELEGADO && document.getElementById('regJuega').checked);

  showAuthError('');
  if(!nombre || !email || !pass){ showAuthError('Completa todos los campos.'); return; }
  if(pass.length < 6){ showAuthError('La contraseña debe tener al menos 6 caracteres.'); return; }
  if(rol !== 'arbitro' && !equipoId){ showAuthError('Elige un equipo.'); return; }

  const btnReg = document.getElementById('btnRegistro');
  if(btnReg){ btnReg.disabled = true; btnReg.textContent = 'Creando cuenta…'; }
  try{
    // Una cuenta nueva siempre recuerda la sesión: no hay motivo para que
    // alguien recién registrado tenga que ingresar otra vez al abrir la app.
    try{ await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await db.collection('users').doc(cred.user.uid).set({
      nombre, email, rol, equipoId, esJugador,
      // Quien juega llena ficha; el resto solo espera la aprobacion.
      estado: esJugador ? EST.FICHA_PENDIENTE : EST.PENDIENTE,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    // onAuthStateChanged will pick this up and route to pending screen
  }catch(e){
    if(btnReg){ btnReg.disabled = false; btnReg.textContent = 'Crear cuenta'; }
    showAuthError(translateAuthError(e));
  }
}

function showAuthError(msg){
  document.getElementById('authError').innerHTML = msg ? `<div class="auth-error">${escapeHtml(msg)}</div>` : '';
}

function translateAuthError(e){
  const map = {
    'auth/email-already-in-use': 'Ese correo ya tiene una cuenta.',
    'auth/invalid-email': 'Correo inválido.',
    'auth/weak-password': 'La contraseña es muy débil.',
    'auth/user-not-found': 'No existe una cuenta con ese correo.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/too-many-requests': 'Demasiados intentos. Prueba de nuevo en un momento.',
    'auth/network-request-failed': 'Sin conexión. Revisa tu internet e inténtalo de nuevo.',
    'auth/missing-email': 'Escribe tu correo.'
  };
  return map[e.code] || ('Error: ' + e.message);
}

// ¿Esta persona juega? Los jugadores siempre; los delegados, si lo declararon.
function juegaEnElTorneo(perfil){
  if(!perfil) return false;
  if(perfil.rol === ROLES.JUGADOR) return true;
  return perfil.rol === ROLES.DELEGADO && perfil.esJugador === true;
}

function enrutarPorEstado(){
  const est = currentProfile.estado;
  if(est === EST.APROBADO){ renderAppShell(); return; }

  if(juegaEnElTorneo(currentProfile)){
    if(est === EST.FICHA_PENDIENTE){ renderOnboardingJugador(); return; }
    if(est === EST.EN_REVISION){ renderEnRevisionScreen(); return; }
  }
  if(est === EST.INHABILITADO){ renderInhabilitadaScreen(); return; }
  if(est === EST.RECHAZADO){ renderRechazadoScreen(); return; }
  renderPendingScreen();
}

// El orden importa: en móvil solo entran los primeros cuatro en la barra
// inferior, así que las tareas propias del rol van primero y lo general después.
function navItemsForRole(rol){
  const general = [
    {id:'calendario', label:'Calendario'},
    {id:'equipos', label:'Equipos'},
    {id:'estadisticas', label:'Estadísticas'},
  ];
  const inicio = {id:'inicio', label:'Inicio'};

  if(rol === ROLES.LIGA_ADMIN){
    return [inicio, {id:'partidos', label:'Partidos'}, {id:'validaciones', label:'Validaciones'},
            {id:'usuarios', label:'Usuarios'}, ...general,
            {id:'mercado', label:'Mercado'}, {id:'arbitros', label:'Árbitros'},
            {id:'configuracion', label:'Configuración'}];
  }
  if(rol === ROLES.DELEGADO){
    // "Mis partidos" reúne convocatoria y validación: el delegado piensa por
    // partido, no por tarea suelta.
    const nav = [inicio, {id:'mispartidos', label:'Partidos'}, {id:'miplantilla', label:'Plantilla'},
                 {id:'fichas', label:'Fichas'}, {id:'mercado', label:'Mercado'},
                 {id:'arbitros', label:'Árbitros'}];
    if(juegaEnElTorneo(currentProfile)) nav.push({id:'mificha', label:'Mi ficha'});
    return [...nav, ...general];
  }
  if(rol === ROLES.ARBITRO){
    return [inicio, {id:'misactas', label:'Actas'}, ...general];
  }
  return [inicio, {id:'mercado', label:'Mercado'}, ...general, {id:'mificha', label:'Mi ficha'}];
}

const NAV_VISIBLES_MOVIL = 4;

function renderNav(nav){
  // Escritorio: rail lateral completo
  document.getElementById('sideNav').innerHTML = nav.map(n =>
    `<button class="${n.id===currentView?'active':''}" onclick="routeTo('${n.id}')">${iconoNav(n.id)}${n.label}</button>`
  ).join('');

  // Móvil: barra inferior con los primeros cuatro; el resto en una hoja "Más"
  const visibles = nav.slice(0, NAV_VISIBLES_MOVIL);
  const ocultos = nav.slice(NAV_VISIBLES_MOVIL);
  const hayOcultoActivo = ocultos.some(n => n.id === currentView);

  document.getElementById('mobileNav').innerHTML =
    visibles.map(n => `<button class="${n.id===currentView?'active':''}" onclick="routeTo('${n.id}')">
        ${iconoNav(n.id)}<span>${n.label}</span></button>`).join('')
    + (ocultos.length ? `<button class="${hayOcultoActivo?'active':''}" onclick="abrirNavMas()">
        ${iconoNav('mas')}<span>Más</span></button>` : '');

  document.getElementById('navMasPanel').innerHTML = `
    <div class="agarre"></div>
    ${ocultos.map(n => `<button class="${n.id===currentView?'active':''}" onclick="irDesdeNavMas('${n.id}')">
        ${iconoNav(n.id)}${n.label}</button>`).join('')}`;
}

function abrirNavMas(){ document.getElementById('navMasSheet').classList.add('abierta'); }
function cerrarNavMas(){ document.getElementById('navMasSheet').classList.remove('abierta'); }
function irDesdeNavMas(id){ cerrarNavMas(); routeTo(id); }

function routeTo(view){
  currentView = view;
  const nav = navItemsForRole(currentProfile.rol);
  renderNav(nav);
  const c = document.getElementById('content');
  c.innerHTML = `<div class="loader" style="margin-top:60px;"></div>`;

  const routes = {
    inicio: renderInicio,
    equipos: renderEquipos,
    miplantilla: renderMiPlantilla,
    calendario: renderCalendario,
    partidos: renderPartidosAdmin,
    misactas: renderMisActas,
    validaciones: renderValidaciones,
    mispartidos: renderMisPartidos,
    mercado: renderMercado,
    fichas: renderFichasPorValidar,
    configuracion: renderConfiguracion,
    arbitros: renderArbitros,
    estadisticas: renderEstadisticas,
    mificha: renderMiFicha,
    usuarios: renderUsuarios
  };
  (routes[view] || renderInicio)();
}

/* =========================================================================
   HELPERS
   ========================================================================= */
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function toast(msg, type=''){
  const area = document.getElementById('toastArea');
  if(!area) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type ? 'toast-'+type : '');
  el.textContent = msg;
  area.appendChild(el);
  setTimeout(()=> el.remove(), 3500);
}
function openModal(html){
  document.getElementById('modalArea').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box" style="position:relative;">
        <button class="close-x" onclick="closeModal()">✕</button>
        ${html}
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modalArea').innerHTML = ''; }

/* =========================================================================
   COLOR DE CADA EQUIPO
   Los equipos se crearon con el color por defecto del formulario, así que
   todos quedaron iguales en la base. Mientras no se les asigne uno propio,
   el color se deduce del nombre — que en esta liga ES el color del equipo.
   ========================================================================= */
const COLORES_POR_NOMBRE = [
  [/rosad/i,            '#E8559A'],
  [/verde|green/i,      '#2E8B4F'],
  [/negro|black/i,      '#1E1A20'],
  [/blanco|white/i,     '#FFFFFF'],
  [/naranj|orange/i,    '#F07818'],
  [/azul|blue/i,        '#1B6FD1'],
  [/\bla\b|rojo|red/i,  '#D82A2A'],   // Team LA juega de rojo
];

// Colores que el formulario puso por defecto en algún momento: si un equipo
// todavía tiene uno de estos, no es una elección, es el valor que vino solo.
const COLORES_POR_DEFECTO = ['#0E3B2E','#932F37','#F5C518','#DDB182'];

function colorEquipo(eq){
  if(!eq) return '#A49CA9';
  const guardado = (eq.colorPrimario || '').toUpperCase();
  if(guardado && !COLORES_POR_DEFECTO.includes(guardado)) return guardado;
  for(const [patron, color] of COLORES_POR_NOMBRE){
    if(patron.test(eq.nombre || '')) return color;
  }
  return '#A49CA9';
}

// El punto lleva un aro sutil para que el blanco y el negro se vean igual
// de bien sobre fondo claro.
function puntoEquipo(color, tam){
  return `<span class="punto-equipo" style="background:${color||'#A49CA9'};${tam?`width:${tam}px;height:${tam}px;`:''}"></span>`;
}

// Equipo con su punto delante, listo para insertar en cualquier lista.
function equipoConPunto(eq, opciones){
  const o = opciones || {};
  if(!eq) return '—';
  return `<span class="equipo-chip${o.invertido?' invertido':''}">
    ${puntoEquipo(eq.color, o.tam)}<span class="equipo-nombre">${escapeHtml(eq.nombre)}</span></span>`;
}

/* Caché de equipos: casi todas las vistas los necesitan y son pocos. */
let _equiposCache = null;
async function cargarEquipos(forzar){
  if(_equiposCache && !forzar) return _equiposCache;
  const snap = await db.collection('equipos').get();
  _equiposCache = {};
  snap.docs.forEach(d => {
    const e = d.data();
    _equiposCache[d.id] = { id:d.id, nombre:e.nombre, color: colorEquipo(e) };
  });
  return _equiposCache;
}
function invalidarCacheEquipos(){ _equiposCache = null; }

async function getEquipoNombre(equipoId){
  if(!equipoId) return '—';
  try{
    const doc = await db.collection('equipos').doc(equipoId).get();
    return doc.exists ? doc.data().nombre : '—';
  }catch(e){ return '—'; }
}

   ========================================================================= */
async function renderInicio(){
  const c = document.getElementById('content');
  c.innerHTML = `<div class="hero-skeleton"><div class="loader" style="margin-top:40px;"></div></div>`;

  const equipoNombre = currentProfile.equipoId ? await getEquipoNombre(currentProfile.equipoId) : null;

  // Datos del panel, según lo que le toca hacer a cada rol
  let proximo = null, pendientes = 0, etiquetaPendientes = '', vistaPendientes = '';
  try{
    const pSnap = await db.collection('partidos').get();
    const partidos = pSnap.docs.map(d => ({id:d.id, ...d.data()}));

    const mios = currentProfile.equipoId
      ? partidos.filter(p => p.equipoLocalId === currentProfile.equipoId || p.equipoVisitanteId === currentProfile.equipoId)
      : partidos;
    proximo = mios.filter(p => p.estado === 'programado')
                  .sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''))[0] || null;

    if(currentProfile.rol === ROLES.LIGA_ADMIN){
      const uSnap = await db.collection('users').get();
      pendientes = uSnap.docs.filter(d => {
        const e = d.data().estado;
        return e === EST.EN_REVISION || e === EST.PENDIENTE;
      }).length;
      etiquetaPendientes = pendientes === 1 ? 'cuenta por aprobar' : 'cuentas por aprobar';
      vistaPendientes = 'usuarios';
    }else if(currentProfile.rol === ROLES.DELEGADO){
      let n = 0;
      for(const p of mios.filter(x => x.estado === 'jugado')){
        const a = await db.collection('actas').doc(p.id).get();
        if(!a.exists) continue;
        const esLocal = p.equipoLocalId === currentProfile.equipoId;
        if(!(esLocal ? a.data().validadoLocal : a.data().validadoVisitante)) n++;
      }
      pendientes = n;
      etiquetaPendientes = n === 1 ? 'acta por validar' : 'actas por validar';
      vistaPendientes = 'mispartidos';
    }else if(currentProfile.rol === ROLES.ARBITRO){
      pendientes = partidos.filter(p => p.estado === 'programado').length;
      etiquetaPendientes = pendientes === 1 ? 'acta por cargar' : 'actas por cargar';
      vistaPendientes = 'misactas';
    }
  }catch(e){ console.warn(e); }

  let proximoHtml = '';
  if(proximo){
    const [loc, vis] = await Promise.all([getEquipoNombre(proximo.equipoLocalId), getEquipoNombre(proximo.equipoVisitanteId)]);
    const f = proximo.fecha ? new Date(proximo.fecha) : null;
    proximoHtml = `
      <div class="proximo-card" onclick="routeTo('calendario')">
        <div class="proximo-tag">Próximo partido</div>
        <div class="proximo-vs">
          <span>${escapeHtml(loc)}</span>
          <span class="proximo-x">vs</span>
          <span>${escapeHtml(vis)}</span>
        </div>
        <div class="proximo-meta">
          ${f ? f.toLocaleDateString('es-VE', {weekday:'long', day:'numeric', month:'long'}) + ' · ' +
                f.toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit'}) : 'Fecha por confirmar'}
          ${proximo.cancha ? ' · ' + escapeHtml(proximo.cancha) : ''}
        </div>
      </div>`;
  }

  const accesos = accesosRapidos();

  c.innerHTML = `
    <div class="hero">
      <img class="hero-crest" src="${LOGO_TFLA}" alt="">
      <div class="hero-saludo">${saludoSegunHora()},</div>
      <h2 class="hero-nombre">${escapeHtml((currentProfile.nombre||'').split(' ')[0])}</h2>
      <div class="hero-rol">${ROLE_LABELS[currentProfile.rol]}${equipoNombre ? ' · ' + escapeHtml(equipoNombre) : ''}</div>
    </div>

    ${pendientes > 0 ? `
      <div class="pendiente-card" onclick="routeTo('${vistaPendientes}')">
        <div class="pendiente-num">${pendientes}</div>
        <div>
          <div class="pendiente-txt">${etiquetaPendientes}</div>
          <div class="pendiente-cta">Ver detalle →</div>
        </div>
      </div>` : ''}

    ${proximoHtml}

    <div class="section-title" style="margin-top:26px;">Accesos rápidos</div>
    <div class="accesos-grid">
      ${accesos.map(a => `
        <button class="acceso" onclick="routeTo('${a.id}')">
          ${iconoNav(a.id)}
          <span class="acceso-label">${a.label}</span>
          <span class="acceso-desc">${a.desc}</span>
        </button>`).join('')}
    </div>

    <p style="font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); margin-top:30px;">${APP_VERSION}</p>`;
}

function saludoSegunHora(){
  const h = new Date().getHours();
  if(h < 12) return 'Buenos días';
  if(h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}

/* =========================================================================
   VIEW: EQUIPOS (lista pública + gestión liga_admin)
   ========================================================================= */
async function renderEquipos(){
  const c = document.getElementById('content');
  const isAdmin = currentProfile.rol === ROLES.LIGA_ADMIN;
  c.innerHTML = `
    <h2>Equipos</h2>
    <p class="page-sub">Plantillas registradas en el torneo</p>
    ${isAdmin ? `<button class="btn btn-primary" style="margin-bottom:18px;" onclick="openNuevoEquipoModal()">+ Nuevo equipo</button>` : ''}
    <div class="grid-cards" id="equiposGrid"><div class="loader"></div></div>
  `;
  try{
    // El total se cuenta sobre la colección de jugadores, no sobre un contador
    // guardado: ese se desincronizaba porque un jugador no tiene permiso para
    // actualizar el documento de su equipo al crear su ficha.
    const [snap, jugSnap] = await Promise.all([
      db.collection('equipos').orderBy('nombre').get(),
      db.collection('jugadores').get()
    ]);
    const porEquipo = {};
    jugSnap.docs.forEach(d => {
      const eid = d.data().equipoId;
      if(eid) porEquipo[eid] = (porEquipo[eid] || 0) + 1;
    });

    const grid = document.getElementById('equiposGrid');
    if(snap.empty){
      grid.innerHTML = `<div class="empty-state">Todavía no hay equipos cargados.</div>`;
      return;
    }
    grid.innerHTML = snap.docs.map(d => {
      const e = d.data();
      const color = colorEquipo(e);
      const n = porEquipo[d.id] || 0;
      return `<div class="team-tile" style="border-left:4px solid ${color};" onclick="verEquipo('${d.id}')">
        <div class="tname">${puntoEquipo(color, 13)} ${escapeHtml(e.nombre)}</div>
        <div class="tmeta">${n === 0 ? 'Sin jugadores todavía' : `${n} jugador${n===1?'':'es'}`}</div>
        ${isAdminLiga() ? `<button class="link-btn" style="font-size:13px; margin-top:8px;"
            onclick="event.stopPropagation(); openEditarEquipoModal('${d.id}')">Editar equipo</button>` : ''}
      </div>`;
    }).join('');
  }catch(e){
    document.getElementById('equiposGrid').innerHTML = `<div class="empty-state">Error cargando equipos: ${escapeHtml(e.message)}</div>`;
  }
}

  openModal(`

async function crearEquipo(){
  const nombre = formatearNombre(document.getElementById('neqNombre').value);
  if(!nombre){ toast('Escribe un nombre para el equipo', 'error'); return; }
  try{
    await db.collection('equipos').add({
      nombre,
      colorPrimario: document.getElementById('neqColor1').value,
      colorSecundario: document.getElementById('neqColor2').value,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    invalidarCacheEquipos();
    closeModal();
    toast('Equipo creado', 'success');
    renderEquipos();
  }catch(e){
    toast('Error: ' + e.message, 'error');
  }
}

async function renderMiPlantilla(){
  const c = document.getElementById('content');
  if(!currentProfile.equipoId){
    c.innerHTML = `<h2>Mi plantilla</h2><div class="empty-state">Tu cuenta no tiene un equipo asignado. Contacta al administrador de la liga.</div>`;
    return;
  }
  c.innerHTML = `
    <h2>Mi plantilla</h2>
    <p class="page-sub">Jugadores y solicitudes pendientes de tu equipo</p>
    <div id="pendientesArea"></div>
    <hr class="section-divider">
    <div id="plantillaArea"><div class="loader"></div></div>
  `;

  try{
    const [pendSnap, apSnap] = await Promise.all([
      db.collection('users').where('equipoId','==',currentProfile.equipoId).get(),
      db.collection('jugadores').where('equipoId','==',currentProfile.equipoId).get()
    ]);

    // Filtramos en el cliente: combinar equipoId con un 'in' sobre estado
    // obligaria a crear un indice compuesto en Firestore.
    const enTramite = pendSnap.docs
      .map(d => ({id:d.id, ...d.data()}))
      .filter(u => u.estado !== EST.APROBADO && u.estado !== EST.RECHAZADO);

    const pendArea = document.getElementById('pendientesArea');
    if(enTramite.length === 0){
      pendArea.innerHTML = '';
    }else{
      // El administrador de la liga es quien aprueba, porque es el unico que ve
      // los documentos de identidad. Aca el delegado solo ve quien viene en camino.
      pendArea.innerHTML = `

function estadoLabel(p){
  const estado = (typeof p === 'string') ? p : (p && p.estado);
  if(p && typeof p === 'object' && p.enDisputa && estado !== 'validado') return 'En disputa';
  return {programado:'Programado', jugado:'Jugado · sin validar', validado:'Oficial'}[estado] || 'Programado';
}
function estadoClase(p){
  if(p.enDisputa && p.estado !== 'validado') return 'disputa';
  return p.estado || 'programado';
}

// "Domingo 22 de noviembre": el locale mete una coma y capitalizar por CSS
// convertiría "de" en "De", así que se arma a mano.
function titularDeFecha(d){
  const dia = d.toLocaleDateString('es-VE', {weekday:'long'});
  const mes = d.toLocaleDateString('es-VE', {month:'long'});
  return `${dia.charAt(0).toLocaleUpperCase('es')}${dia.slice(1)} ${d.getDate()} de ${mes}`;
}

async function renderCalendarioInto(containerId, conAcciones){
  try{
    const snap = await db.collection('partidos').get();
    const area = document.getElementById(containerId);
    if(!area) return;
    if(snap.empty){ area.innerHTML = '<div class="empty-state">Todavía no hay partidos programados.</div>'; return; }

    const partidos = snap.docs.map(d => ({id:d.id, ...d.data()}))
      .sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));

    const equipos = await cargarEquipos();

    // Agrupar por día. La clave sale de la fecha LOCAL, no del ISO en UTC,
    // para que un partido de la noche no se vaya al día siguiente.
    const grupos = new Map();
    for(const p of partidos){
      const d = p.fecha ? new Date(p.fecha) : null;
      const clave = d ? `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` : 'sin-fecha';
      if(!grupos.has(clave)) grupos.set(clave, { fecha: d, partidos: [] });
      grupos.get(clave).partidos.push(p);
    }

    const esAdmin = currentProfile.rol === ROLES.LIGA_ADMIN;
    const hoy = new Date(); hoy.setHours(0,0,0,0);

    area.innerHTML = [...grupos.values()].map(g => {
      const jornadas = [...new Set(g.partidos.map(p => p.jornada).filter(x => x != null))];
      const canchas = [...new Set(g.partidos.map(p => p.cancha).filter(Boolean))];
      const esHoy = g.fecha && new Date(g.fecha).setHours(0,0,0,0) === hoy.getTime();

      const titulo = g.fecha ? titularDeFecha(g.fecha) : 'Sin fecha asignada';
      const anio = g.fecha ? g.fecha.getFullYear() : '';

      const filas = g.partidos.map(p => {
        const local = equipos[p.equipoLocalId];
        const visitante = equipos[p.equipoVisitanteId];
        const jugado = p.estado === 'jugado' || p.estado === 'validado';
        const hora = p.fecha
          ? new Date(p.fecha).toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit', hour12:false})
          : '--:--';

        const marcador = jugado
          ? `<span class="pf-goles">${p.golesLocal ?? 0}</span><span class="pf-guion">-</span><span class="pf-goles">${p.golesVisitante ?? 0}</span>`
          : '<span class="pf-vs">vs</span>';

        // El estado solo se muestra cuando aporta algo: "Oficial" o un problema.
        let chip = '';
        if(p.enDisputa && p.estado !== 'validado') chip = '<span class="pf-chip disputa">En disputa</span>';
        else if(p.estado === 'validado') chip = '<span class="pf-chip oficial">Oficial</span>';
        else if(p.estado === 'jugado') chip = '<span class="pf-chip pendiente">Sin validar</span>';

        let acciones = '';
        if(conAcciones){
          acciones = `<div class="pf-acciones">
            <button class="icon-btn" title="${p.estado==='programado'?'Cargar acta'
                        : p.estado==='validado' ? (esAdmin ? 'Ver o corregir acta cerrada' : 'Ver acta (cerrada)')
                        : 'Ver o editar acta'}"
                    onclick="event.stopPropagation(); ${p.estado==='validado' && !esAdmin ? `verActaDetalle('${p.id}')` : `abrirActaForm('${p.id}')`}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
            </button>
            ${esAdmin ? `
            <button class="icon-btn" title="Editar partido" onclick="event.stopPropagation(); openEditarPartidoModal('${p.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M14.5 5.5 18.5 9.5"/></svg>
            </button>
            <button class="icon-btn peligro" title="Eliminar partido" onclick="event.stopPropagation(); eliminarPartido('${p.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg>
            </button>` : ''}
          </div>`;
        }

        const abrible = !conAcciones && jugado;
        return `<div class="partido-fila${abrible?' abrible':''}"
                     ${abrible ? `onclick="verActaDetalle('${p.id}')"` : ''}>
          <span class="pf-hora">${hora}</span>
          <span class="pf-equipo pf-local">${equipoConPunto(local, {invertido:true})}</span>
          <span class="pf-marcador">${marcador}</span>
          <span class="pf-equipo">${equipoConPunto(visitante)}</span>
          ${chip}${acciones}
        </div>`;
      }).join('');

      return `<section class="fecha-grupo${esHoy?' es-hoy':''}">
        <header class="fecha-cab">
          <div class="fecha-dia">${escapeHtml(titulo)}${anio ? ` <span class="fecha-anio">${anio}</span>` : ''}</div>
          <div class="fecha-meta">
            ${jornadas.length === 1 ? `Jornada ${jornadas[0]}` : jornadas.length > 1 ? `Jornadas ${jornadas.join(', ')}` : ''}
            ${canchas.length === 1 ? `<span class="sep">·</span>${escapeHtml(canchas[0])}` : ''}
            ${esHoy ? '<span class="pf-chip hoy">Hoy</span>' : ''}
          </div>
        </header>
        <div class="fecha-partidos">${filas}</div>
      </section>`;
    }).join('');
  }catch(e){
    const area = document.getElementById(containerId);
    if(area) area.innerHTML = `<div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

async function crearPartido(){
  const equipoLocalId = document.getElementById('pLocal').value;
  const equipoVisitanteId = document.getElementById('pVisitante').value;
  if(equipoLocalId === equipoVisitanteId){ toast('El local y el visitante deben ser distintos', 'error'); return; }
  try{
    await db.collection('partidos').add({
      equipoLocalId, equipoVisitanteId,
      fecha: document.getElementById('pFecha').value ? new Date(document.getElementById('pFecha').value).toISOString() : null,
      jornada: Number(document.getElementById('pJornada').value) || null,
      cancha: document.getElementById('pCancha').value.trim(),
      estado: 'programado',
      golesLocal: null, golesVisitante: null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeModal();
    toast('Partido programado', 'success');
    renderPartidosAdmin();
  }catch(e){
    toast('Error: ' + e.message, 'error');
  }
}

async function abrirActaForm(partidoId){
  const c = document.getElementById('content');

  const p = pDoc.data();

  const [jugLocalSnap, jugVisSnap, actaDoc, convLocal, convVis] = await Promise.all([
    db.collection('jugadores').where('equipoId','==',p.equipoLocalId).get(),
    db.collection('jugadores').where('equipoId','==',p.equipoVisitanteId).get(),
    db.collection('actas').doc(partidoId).get(),
    leerConvocatoria(partidoId, p.equipoLocalId),
    leerConvocatoria(partidoId, p.equipoVisitanteId)

  // Si el delegado cargó convocatoria, el árbitro solo ve a los convocados.
  // Si no la cargó, se muestra la plantilla completa para no bloquear el acta.
  const idsLocal = convLocal && convLocal.jugadorIds && convLocal.jugadorIds.length ? new Set(convLocal.jugadorIds) : null;
  const idsVis   = convVis   && convVis.jugadorIds   && convVis.jugadorIds.length   ? new Set(convVis.jugadorIds)   : null;

  jugVisSnap.docs.forEach(d => { if(!idsVis || idsVis.has(d.id)) jugadoresMap[d.id] = {...d.data(), equipoLado:'visitante'}; });

  // Si el acta ya tenía incidencias de alguien que después salió de la
  // convocatoria, ese jugador se conserva para no romper el registro.
  const incidenciasPrevias = actaDoc.exists ? (actaDoc.data().incidencias || []) : [];

  if(jugVisSnap.empty) faltanJugadores.push(visitante);

  c.innerHTML = `

    <h2 style="margin-top:14px;">${escapeHtml(local)} vs ${escapeHtml(visitante)}</h2>
    <p class="page-sub">Jornada ${p.jornada ?? '—'}</p>

    ${_correccionAdmin ? `<div class="card" style="border-left:4px solid var(--card-red);">
      <div class="section-title">Acta cerrada · corrección excepcional</div>
      <p style="font-size:14px; line-height:1.6; margin-bottom:12px;">
        Esta acta ya fue validada por los dos equipos y es <b>oficial</b>. Cambiarla modifica la
        tabla de posiciones y las estadísticas. La corrección queda registrada con tu nombre, la
        fecha y el motivo, y la ven todos los que abran el acta.
      </p>
      <div class="field" style="margin-bottom:0;"><label>Motivo de la corrección (obligatorio)</label>
        <textarea id="corrMotivo" rows="3" maxlength="240"
          placeholder="Ej: El árbitro anotó el gol al jugador equivocado; confirmado por los dos delegados."></textarea></div>
    </div>` : ''}

    <div id="alineacionesArbitro"></div>

    ${(idsLocal || idsVis) ? `<div class="auth-note" style="margin-bottom:16px;">
      ${idsLocal && idsVis
        ? 'Los dos equipos cargaron convocatoria: abajo solo aparecen los jugadores convocados.'
        : `Solo ${idsLocal ? escapeHtml(local) : escapeHtml(visitante)} cargó convocatoria. Del otro equipo se muestra la plantilla completa.`}
    </div>` : ''}

    ${faltanJugadores.length ? `<div class="card" style="border-left:4px solid var(--card-yellow);">
      <div class="section-title">Falta cargar la plantilla</div>
      <p style="font-size:14px; line-height:1.6;">
        ${faltanJugadores.length === 2
          ? `Ni ${escapeHtml(faltanJugadores[0])} ni ${escapeHtml(faltanJugadores[1])} tienen jugadores registrados.`
          : `${escapeHtml(faltanJugadores[0])} todavía no tiene jugadores registrados.`}
        Puedes guardar el marcador, pero para registrar goles y tarjetas hace falta que los jugadores estén en la plantilla.

        ${jugVisSnap.empty ? `<button class="btn btn-sm btn-secondary" onclick="verEquipo('${p.equipoVisitanteId}')">Cargar plantilla de ${escapeHtml(visitante)}</button>` : ''}

      : `<button class="btn btn-primary" style="margin-top:6px;" onclick="guardarActa('${partidoId}')">Guardar y enviar a validación</button>`}
  `;

  window.__jugOptions = { local: jugOptions('local'), visitante: jugOptions('visitante'), map: jugadoresMap };
  refreshIncJugadorOptions();
  renderIncidenciasList();

  // Las alineaciones van arriba del acta: el árbitro las aprueba antes de empezar.
  if(!_correccionAdmin){
    bloqueAlineacionesArbitro(partidoId, p, local, visitante)
      .then(h => { const el = document.getElementById('alineacionesArbitro'); if(el) el.innerHTML = h; })
      .catch(e => console.warn('alineaciones:', e));
  }
}

async function guardarActa(partidoId){
  try{
    // Entre que se abrió el formulario y ahora, los dos delegados pueden haber
    // cerrado el acta. Se vuelve a mirar antes de escribir.
    const previa = await db.collection('actas').doc(partidoId).get();
    if(actaEstaCerrada(previa.exists ? previa.data() : null) && currentProfile.rol !== ROLES.LIGA_ADMIN){
      toast('El acta se cerró mientras la editabas: ya no se puede modificar', 'error');
      verActaDetalle(partidoId);
      return;
    }

    const golesLocal = Number(document.getElementById('golesLocal').value) || 0;
    const golesVisitante = Number(document.getElementById('golesVisitante').value) || 0;

    await db.collection('actas').doc(partidoId).set({
      partidoId,
      arbitroUid: currentUser.uid,
      arbitroNombre: currentProfile.nombre,
      incidencias: actaIncidenciasTemp,
      golesLocal, golesVisitante,
      validadoLocal: false,
      validadoVisitante: false,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});

    // enDisputa:false — si había una objeción, esta corrección la responde.
    await db.collection('partidos').doc(partidoId).update({
      estado: 'jugado', golesLocal, golesVisitante, enDisputa: false
    });

    toast('Acta guardada y enviada a validación', 'success');
    renderMisActas();
  }catch(e){
    toast(mensajeDeEscritura(e), 'error');
  }
}

        const yaValide = esLocal ? acta.validadoLocal : acta.validadoVisitante;
        miValidacionBoton = yaValide
